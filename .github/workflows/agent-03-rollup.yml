name: Agent - AW03 Roll Up Parent Status

# Closing an Implementation Task does two things:
#
# nothing on its own, unless it was the last open sub-issue of a Feature --
# in which case the Feature is ready for the human check that closes it, and
# this workflow says so in a comment.
#
# A comment, specifically, because a comment notifies you. The control plane
# Issue shows the same fact once it is re-rendered, and an issue view can be
# filtered to surface it -- but neither one pushes.
#
# Task and Feature *status* is not written anywhere as a field: it is a label
# query where a label can express it, and otherwise derived on demand by
# .github/scripts/render-dashboard.py. See docs/AGENT_WORKFLOW.md.

on:
  issues:
    types:
      - closed
      - reopened

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Parent Feature number to re-evaluate"
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-rollup-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  rollup:
    name: Agent - AW03 Roll Up Parent Status
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Issue and Parent
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,url,state,parent,subIssues \
            > issue.json

          STATE=$(jq -r '.state' issue.json)
          OWN_SUBS=$(jq -r '.subIssues.totalCount // 0' issue.json)

          {
            echo "state=$STATE"
            echo "url=$(jq -r '.url' issue.json)"
            echo "own_subs=$OWN_SUBS"
          } >> "$GITHUB_OUTPUT"

          # workflow_dispatch points straight at a parent; the issues trigger
          # points at the child, so the parent has to be looked up.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "$OWN_SUBS" -gt 0 ]; then
            echo "target_parent=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "has_parent=true" >> "$GITHUB_OUTPUT"
            echo "is_child=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARENT=$(jq -r '.parent.number // empty' issue.json)

          if [ -z "$PARENT" ]; then
            echo "has_parent=false" >> "$GITHUB_OUTPUT"
            echo "is_child=false" >> "$GITHUB_OUTPUT"
            echo "Issue #$ISSUE_NUMBER has no parent. Nothing to roll up."
            exit 0
          fi

          echo "has_parent=true" >> "$GITHUB_OUTPUT"
          echo "is_child=true" >> "$GITHUB_OUTPUT"
          echo "target_parent=$PARENT" >> "$GITHUB_OUTPUT"
          echo "Issue #$ISSUE_NUMBER rolls up to Feature #$PARENT"

      # ---------------------------------------------------------------
      # The closed child itself.
      # ---------------------------------------------------------------

      - name: Evaluate Parent Completion
        id: parent
        if: steps.resolve.outputs.has_parent == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PARENT="${{ steps.resolve.outputs.target_parent }}"

          gh issue view "$PARENT" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,url,state,subIssues \
            > parent.json

          PARENT_STATE=$(jq -r '.state' parent.json)
          TOTAL=$(jq -r '.subIssues.totalCount // 0' parent.json)

          # Read the child states directly rather than trusting the cached
          # subIssuesSummary counters, which can lag the close event.
          OPEN_SUBS=$(
            jq -r '
              [.subIssues.nodes[]? | select(.state == "OPEN") | "#\(.number)"]
              | join(", ")
            ' parent.json
          )

          OPEN_COUNT=$(
            jq -r '[.subIssues.nodes[]? | select(.state == "OPEN")] | length' \
              parent.json
          )

          {
            echo "url=$(jq -r '.url' parent.json)"
            echo "title=$(jq -r '.title' parent.json)"
            echo "total=$TOTAL"
            echo "open_count=$OPEN_COUNT"
            echo "open_subs=$OPEN_SUBS"
          } >> "$GITHUB_OUTPUT"

          if [ "$PARENT_STATE" != "OPEN" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Parent #$PARENT is already closed."
            exit 0
          fi

          if [ "$TOTAL" -eq 0 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Parent #$PARENT has no sub-issues."
            exit 0
          fi

          if [ "$OPEN_COUNT" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All $TOTAL sub-issue(s) of #$PARENT are closed."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Parent #$PARENT still waiting on: $OPEN_SUBS"
          fi

      - name: Notify Parent
        if: steps.parent.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PARENT="${{ steps.resolve.outputs.target_parent }}"

          gh issue comment "$PARENT" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(cat <<'EOF'
          <!-- agent-rollup-complete -->

          All Implementation Tasks for this Feature are closed.

          Remaining work is human: confirm the Feature's own acceptance
          criteria hold end to end, complete any **Human Validation Required**
          checks in the Godot editor, then close this Issue.
          EOF
          )"

          {
            echo "### Feature ready for human review"
            echo ""
            echo "- Feature: [#$PARENT](${{ steps.parent.outputs.url }})"
            echo "- Sub-issues closed: ${{ steps.parent.outputs.total }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report Still Waiting
        if: >
          steps.resolve.outputs.has_parent == 'true' &&
          steps.parent.outputs.complete != 'true'
        shell: bash
        run: |
          {
            echo "### Parent not yet complete"
            echo ""
            echo "Feature #${{ steps.resolve.outputs.target_parent }} is" \
                 "still waiting on:" \
                 "${{ steps.parent.outputs.open_subs || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
