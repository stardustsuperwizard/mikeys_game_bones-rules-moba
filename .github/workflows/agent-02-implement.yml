name: Agent - AW02 Execute Task

# Implements a GitHub Implementation Task Issue end to end using the
# Copilot CLI: opens the pull request that closes the Issue as soon as the
# implementor's commit exists, then applies gdformat to whatever GDScript it
# touched, reviews its own diff, and applies one bounded fix pass if that
# review says FIX -- all as best-effort follow-ups pushed onto the branch
# behind the pull request that is already open by then.
#
# The pull request opens as a **draft**, and only "Record Verified
# Validation" (the last step to touch it) marks it ready for review, after
# running `validate-godot.sh` itself against the commit the branch ends up
# pointing at and writing the exit status into the body. Everything else a
# reader would take as a validation result -- the completion report that
# becomes the body, the pre-PR review and fix comments -- is a session
# describing its own work, and none of it is checked against anything.
# Sessions have both skipped validation and reported it in the same
# breath, and the shape of the prose does not distinguish the two, so the
# draft state is what carries the difference: draft means no verified run
# stands behind this pull request yet.
#
# This matters most on the path where the implementor deliberately did *not*
# commit. "Commit Leftover Changes" rescues that work rather than
# discarding it, which is right -- but it manufactures the very signal
# "Check For Commit" says it trusts, so an unvalidated session's work can
# reach a pull request. Draft-until-verified is what keeps that from
# looking identical to a finished one.
#
# The gdformat pass is unconditional and needs no model: mechanical,
# diff-scoped (see lint-gdscript/action.yml for why not whole-repo), and
# committed before the pre-PR review runs so the reviewer never spends
# judgment on something a formatter already fixed for free.
#
# This is the scripted alternative to assigning the Issue to the Copilot
# cloud agent from the Issues UI. The two are different products with
# different constraints:
#
#   - The cloud agent (Issue assignment, GitHub Mobile) cannot have its
#     model chosen programmatically -- only a human at the picker can do
#     that. That path stays available for when you want to hand-pick a
#     model or watch the session live.
#
#   - The Copilot CLI run here is fully scriptable, the same way
#     `agent-01-planner.yml`, `agent-04-review.yml`, and `agent-05-fix.yml`
#     already script it. Claude Haiku 4.5 is a supported CLI model (see
#     https://docs.github.com/en/copilot/reference/ai-models/supported-models)
#     even though it is not offered to the cloud agent, which is why this
#     workflow can default to it for implementation: a bounded,
#     contract-driven task is a reasonable fit for the cheaper tier, in a
#     way blind review or planning is not. The pre-PR review below still
#     gets the strong tier, same as `agent-04-review.yml` -- the fact that
#     it happens before the pull request exists doesn't make it a cheaper
#     judgment call.
#
# The self-review step and `agent-04-review.yml` share three composite
# actions (`build-review-request`, `run-agent-session`,
# `extract-review-verdict`) so both apply the exact same completeness
# rule and the exact same reviewer contract -- the only difference is
# whether the diff is already a pull request or still local. Likewise the
# fix pass shares `build-fix-request` with `agent-05-fix.yml`. "The
# workflow pulls the PR information, the review/fix agent just processes
# it" is the split those composite actions make literal: everything in
# them is deterministic gh/jq/python except the one Copilot CLI call each
# wraps.
#
# `issue-linking.yml` still handles closing-reference bookkeeping for PRs
# that came from the cloud-agent path. This workflow gets `Closes #<n>`
# right from the start instead, because it writes the pull request itself,
# only after its own validation and (when applicable) review-and-fix pass.
#
# Deliberately human-gated, like `agent:plan`/`agent:review`/`agent:fix`:
# this workflow pushes a branch and opens a pull request, so it never fires
# just because an Issue exists or gets assigned. A human decides when to
# spend it by adding `agent:execute` (works from GitHub Mobile).
#
# The pull request opens as soon as the implementor's commit exists --
# immediately after "Check For Commit" below, before validation,
# formatting, or the pre-PR review-and-fix pass ever run. Everything from
# "Re-run Validation" onward is a best-effort follow-up against that
# already-open pull request: a validation failure, a review session that
# can't complete (budget, availability, malformed output), or a FIX
# verdict's correction that doesn't land cleanly all leave the pull
# request open and simply skip (or leave unfixed) whatever step didn't
# finish, instead of withholding the pull request until every later step
# succeeds. That way a failure partway through this pipeline still hands
# back a working pull request instead of a dead-end Issue comment -- see
# "Evaluate Pre-PR Review" and "Evaluate Pre-PR Fix" below for exactly what
# "doesn't land cleanly" means, and "Report Validation Failure" for what
# happens when validation itself is what fails.

on:
  issues:
    types:
      - labeled

  workflow_dispatch:
    inputs:
      issue_number:
        description: "Implementation Task Issue number to implement"
        required: true
        type: number

      vendor:
        description: >
          Which company answers. A labelled run takes this from the label's
          third segment instead; this input exists because workflow_dispatch
          has no label to read.
        required: false
        type: choice
        options:
          - copilot
          - claude
        default: copilot

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: agent-execute-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  execute:
    name: Agent - AW02 Execute Task
    runs-on: ubuntu-latest

    # Consumed only by `validate-pushed-commit` below. Everything here is
    # read back out of a step that already knew the value -- no step's
    # behaviour, `if:` condition or `continue-on-error` setting changes to
    # produce them.
    outputs:
      branch: ${{ env.BRANCH }}
      pushed: ${{ steps.pushed.outputs.pushed }}
      pushed-sha: ${{ steps.pushed.outputs.sha }}
      pr-url: ${{ steps.pr.outputs.pr_url }}

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'agent:implementor:copilot' ||
        github.event.label.name == 'agent:implementor:claude' ||
        github.event.label.name == 'agent:execute'))

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}

      # Bounded, contract-driven implementation work is a reasonable fit for
      # the cheap tier -- unlike blind review or planning, there is a
      # concrete Acceptance Criteria list to follow. Still a preference
      # list, still per-identity availability (see the long note in
      # agent-01-planner.yml): the next candidate is only tried when a
      # model is unavailable to this identity, never after a real failure,
      # the same rule every other workflow here follows.
      IMPLEMENTOR_MODELS: >-
        ${{ vars.IMPLEMENTOR_MODELS
        || 'claude-opus-5,claude-sonnet-5,claude-haiku-4.5' }}
      IMPLEMENTOR_MAX_AI_CREDITS: "150"

      # "Resolve Implementor Model Tier" below can put a planner's per-task
      # recommendation in front of that list. These two bound it.
      #
      # An operator who sets IMPLEMENTOR_MODELS has made a deliberate choice
      # about this repository; a planner's guess about one task must not
      # quietly overrule it. The expression above cannot tell the two cases
      # apart once it has collapsed to a value, so the emptiness of the
      # variable is captured separately here, before the `||`.
      IMPLEMENTOR_MODELS_PINNED: ${{ vars.IMPLEMENTOR_MODELS != '' }}

      # Lower bound on what a planner may ask for, so the cheap tier can be
      # taken out of circulation repository-wide without editing the
      # planner's rubric or relabelling any Issue.
      IMPLEMENTOR_TIER_FLOOR: ${{ vars.IMPLEMENTOR_TIER_FLOOR || 'haiku' }}

      # Same variables and defaults as agent-04-review.yml / agent-05-fix.yml
      # -- deliberately, so tuning one repository variable affects the
      # standalone workflow and this pre-PR pass identically.
      REVIEWER_MODELS: >-
        ${{ vars.REVIEWER_MODELS
        || vars.REVIEWER_MODEL
        || 'claude-opus-5,claude-opus-4.8,claude-opus-4.7,claude-sonnet-5' }}
      REVIEWER_MAX_AI_CREDITS: "75"

      FIXER_MODELS: >-
        ${{ vars.FIXER_MODELS
        || 'claude-sonnet-5,claude-sonnet-4.5,claude-opus-5' }}
      # 150, not the reviewer's 75: this session edits files and re-runs
      # validation rather than only reading, and 100 was not enough --
      # the pre-PR fix pass on #165 stopped mid-task with
      # `budget_exhausted` at the old cap, leaving a partially-applied
      # fix behind. Kept in lockstep with agent-05-fix.yml.
      FIXER_MAX_AI_CREDITS: "150"

      MAX_DIFF_CHARS: "150000"

      BRANCH: agent-exec/${{ inputs.issue_number || github.event.issue.number }}

    steps:
      # The vendor comes from the label's third segment. Everything after
      # this step reads one outcome file and one text file and never learns
      # which company answered.
      - name: Route Vendor
        id: route
        shell: bash
        env:
          LABEL: ${{ github.event.label.name }}
          DISPATCH_VENDOR: ${{ inputs.vendor }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no label, and the legacy label has no vendor
          # segment. Both mean copilot, which is what they have always meant.
          case "$LABEL" in
            agent:implementor:claude)  VENDOR=claude ;;
            agent:implementor:copilot) VENDOR=copilot ;;
            *)                  VENDOR="${DISPATCH_VENDOR:-copilot}" ;;
          esac

          echo "vendor=$VENDOR" >> "$GITHUB_OUTPUT"
          echo "Running as $VENDOR"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Implementation Task Issue
        id: context
        shell: bash
        run: |
          set -euo pipefail

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,state,labels \
            > issue.json

          echo "issue_url=$(jq -r '.url' issue.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title' issue.json)" >> "$GITHUB_OUTPUT"

          # Computed here, not down in "Prepare Diff and Draft Title", so it
          # exists before the branch-existence check below and doesn't
          # require a fresh implementor run to produce. Implementation Task
          # Issues are titled "[impl] <description>"; the pull request tag
          # is "[<n>] <description>" instead.
          TITLE_RAW=$(jq -r '.title' issue.json)
          TITLE_STRIPPED=$(echo "$TITLE_RAW" | sed -E 's/^\[impl\]\s*//i')
          echo "PR_TITLE=[$ISSUE_NUMBER] $TITLE_STRIPPED" >> "$GITHUB_ENV"

          if [ "$(jq -r '.state' issue.json)" != "OPEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=not_open" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.labels[].name] | index("implementation")' issue.json \
              > /dev/null; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=not_implementation_task" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Blockers come from the REST dependencies endpoint, not from
          # `gh issue view --json blockedBy`, and this guard fails closed.
          #
          # What it used to read was:
          #
          #   [.blockedBy.nodes[]? | select(.state == "OPEN") | ...]
          #
          # and the `?` is the problem. It suppresses the iterate-over-null
          # error, so a `blockedBy` that arrives null -- a renamed field, a
          # dependencies API hiccup, a `gh` that reports the field without
          # populating it -- yields an empty list, which is byte-identical to
          # "this task is unblocked". The workflow then spends a full implementor
          # session implementing a task whose dependency has not landed, which
          # is the exact outcome the guard exists to prevent. "Cannot tell"
          # must never resolve to "go ahead".
          #
          # The endpoint has a known shape (a JSON array of issue objects) and
          # no `gh` version floor -- `--json blockedBy` needs GitHub CLI
          # 2.94.0, this needs only `gh api`. Note REST spells the state
          # lowercase where the GraphQL-backed `--json` output spells it
          # upper, hence the `ascii_downcase`.
          if ! gh api \
               "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/dependencies/blocked_by?per_page=100" \
               > blockers.json; then
            echo "::error::Could not read #$ISSUE_NUMBER's blockers." \
                 "Refusing to dispatch a session that may be blocked." \
                 "Re-add \`agent:execute\` once the API is reachable."
            exit 1
          fi

          BLOCKERS=$(
            jq -r '
              [
                .[]
                | select((.state | ascii_downcase) == "open")
                | "#\(.number)"
              ]
              | join(", ")
            ' blockers.json
          )

          if [ -n "$BLOCKERS" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=blocked" >> "$GITHUB_OUTPUT"
            echo "blockers=$BLOCKERS" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The one guard here that is about *this workflow's credentials*
          # rather than the Issue's readiness.
          #
          # GITHUB_TOKEN cannot write `.github/workflows/**` or
          # `.github/actions/**`. There is no `permissions:` key that grants
          # it -- GitHub reserves workflow edits for credentials carrying the
          # `workflow` OAuth scope, deliberately, so that a compromised
          # workflow cannot rewrite its own CI. Without this check the run
          # gets all the way to `Push Branch and Open Pull Request` before
          # the remote rejects it, having already paid for a full implementor
          # session that produced a complete implementation. That happened
          # three times on #167's decomposition (#168, #169, #170); the work
          # was hand-authored afterwards as #172, #173 and #174.
          #
          # Checked against the Issue's own declared expected files, not
          # against a guess from its title. Uncertain means eligible: an
          # Issue with no parseable expected-files section dispatches exactly
          # as it did before this guard existed, because a false positive
          # blocks real work while a false negative costs one session and
          # says why.
          jq -r '.body // ""' issue.json > issue-body.md

          if ! python3 .github/scripts/task_scope.py \
              --body-file issue-body.md > task-scope.json
          then
            echo "::warning::task_scope.py did not run; treating this Issue" \
              "as implementor-eligible."
            echo '{"implementor_eligible": true, "restricted_paths": []}' \
              > task-scope.json
          fi

          if [ "$(jq -r '.implementor_eligible' task-scope.json)" = "false" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_scope" >> "$GITHUB_OUTPUT"
            echo "restricted_paths=$(
              jq -r '[.restricted_paths[] | "`\(.)`"] | join(", ")' \
                task-scope.json
            )" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING=$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --state all \
              --json number,url \
              --jq 'first(.[]) // empty'
          )

          if [ -n "$EXISTING" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=pr_exists" >> "$GITHUB_OUTPUT"
            echo "existing_pr_url=$(echo "$EXISTING" | jq -r '.url')" \
              >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Report Guard Failure
        if: steps.context.outputs.ok != 'true'
        shell: bash
        # Read through the environment rather than interpolated straight into
        # the script below. Every other value in this step is derived from
        # repository state -- `blockers` is a list of issue numbers, and the
        # URL comes from `gh` -- but `restricted_paths` is quoted out of an
        # Issue body, which anyone who can file an Issue controls, and it
        # carries backticks by construction. `${{ }}` would paste those into
        # a double-quoted bash string, where a backtick is command
        # substitution; a variable expansion is not re-evaluated, so this is.
        env:
          RESTRICTED_PATHS: ${{ steps.context.outputs.restricted_paths }}
        run: |
          set -euo pipefail

          REASON="${{ steps.context.outputs.reason }}"

          case "$REASON" in
            not_open)
              MSG="This Issue is not open. Nothing to execute."
              ;;
            not_implementation_task)
              MSG="This Issue is not labeled \`implementation\`. \`agent:execute\` only runs against Implementation Task Issues."
              ;;
            blocked)
              MSG="This Issue is blocked by: **${{ steps.context.outputs.blockers }}**. Resolve those first, then re-add \`agent:execute\`."
              ;;
            pr_exists)
              MSG="A pull request already exists for this Issue: ${{ steps.context.outputs.existing_pr_url }}. \`agent:execute\` is for starting fresh implementation, not correcting existing work -- use the \`agent:fix\` label on that pull request instead."
              ;;
            workflow_scope)
              # Built by appending rather than written as one multi-line
              # string: a continuation line at column 0 would terminate this
              # step's YAML block scalar, and indenting it to stay inside the
              # block would put ten leading spaces into the comment, which
              # GitHub renders as a code block.
              MSG="This task expects to change $RESTRICTED_PATHS, and the scripted implementor cannot push those paths."
              MSG="$MSG"$'\n\n'"\`GITHUB_TOKEN\` is not allowed to create or update files under \`.github/workflows/\` or \`.github/actions/\`. No \`permissions:\` key grants it: GitHub reserves workflow edits for credentials carrying the \`workflow\` OAuth scope, so that a compromised workflow cannot rewrite its own CI. The restriction is deliberate and this workflow respects it rather than working around it."
              MSG="$MSG"$'\n\n'"Refused before any session starts, because the push is the *last* step of an execution run. Without this check the run implements the task in full and then loses all of it at the push, having spent the credits either way."
              MSG="$MSG"$'\n\n'"**Run this task from a human-credentialed session instead.** A Claude Code session -- terminal, desktop, web, or Remote Control -- pushes with your own credentials and can write these paths. It reads the same contract this Issue encodes: see *Claude Code as an additional environment* in \`docs/AGENT_WORKFLOW.md\`, and \`CLAUDE.md\` at the repository root. Open the pull request with \`Closes #$ISSUE_NUMBER\`, and add \`agent:review\` to it by hand so it goes through the same review gate everything else does."
              MSG="$MSG"$'\n\n'"Assigning this Issue to the Copilot cloud agent will not help -- that path is subject to the same restriction."
              ;;
            *)
              MSG="Guard check failed for an unrecognised reason: \`$REASON\`."
              ;;
          esac

          {
            echo "<!-- agent-execute-skipped -->"
            echo ""
            echo "## Execution not started"
            echo ""
            echo "$MSG"
          } > skip-comment.md

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file skip-comment.md

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "${TRIGGER_LABEL:-agent:execute}" || true

          cat skip-comment.md >> "$GITHUB_STEP_SUMMARY"

      # Catches the one case "Resolve Implementation Task Issue"'s pr_exists
      # guard doesn't: a prior run that pushed $BRANCH but never got a pull
      # request onto it (e.g. `gh pr create` itself failed after the push --
      # see the comment on that failure in "Push Branch and Open Pull
      # Request" below). Re-adding `agent:execute` today would blow that
      # branch away with `git checkout -B` and pay for a whole new implementor
      # session to reproduce a commit that already exists. Checking here,
      # before Godot setup or any Copilot session, means a hit skips the
      # entire expensive part of this job.
      - name: Check For Existing Branch
        if: steps.context.outputs.ok == 'true'
        id: branch-check
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git Identity
        if: steps.context.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # BASE_SHA is the point every later diff/verdict is measured against.
      # On a fresh branch that's simply the checkout point. On a resumed
      # branch it must be the merge-base with the default branch -- not the
      # branch tip -- so "Check For Commit" still sees the existing
      # implementation commit as new work, and the reviewer still gets the
      # full Issue diff instead of an empty one.
      - name: Create Working Branch
        if: steps.context.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.branch-check.outputs.exists }}" = "true" ]; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"

            DEFAULT_BRANCH=$(
              gh repo view "$GITHUB_REPOSITORY" \
                --json defaultBranchRef --jq '.defaultBranchRef.name'
            )
            # actions/checkout runs with fetch-depth: 1, so the local clone
            # only ever holds single-commit shallow slices of each ref --
            # "origin/$DEFAULT_BRANCH" and this branch's tip share no
            # history locally, so `git merge-base` between them finds
            # nothing and fails silently (empty stdout, no "fatal:" line;
            # merge-base just returns 1 when there's no common ancestor).
            # GitHub's compare API computes the merge-base server-side, so
            # it needs no local history at all -- ask it instead of git.
            BASE_SHA=$(
              gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$BRANCH" \
                --jq '.merge_base_commit.sha'
            )
            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          else
            git checkout -B "$BRANCH"

            echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi

      # Needed before the implementor session even starts: the implementor's own
      # hard rules (below) tell it to run `validate-godot.sh` itself, and
      # the outer "Re-run Validation" / "Apply GDScript Formatting" /
      # "Evaluate Pre-PR Fix" steps all shell out to it later too. Every
      # other workflow that calls validate-godot.sh installs Godot first
      # (see godot-ci-validation.yml, balance-fast.yml, balance-deep.yml) --
      # this one was missing it, so validate-godot.sh's own
      # `command -v godot` guard was hitting its `exit 127` unconditionally.
      - name: Setup Godot
        if: steps.context.outputs.ok == 'true'
        uses: ./.github/actions/setup-godot
        with:
          godot-version: 4.7.1-stable

      # The planner recommends a tier per task; this turns that into the
      # model preference list the session actually walks.
      #
      # It PREPENDS rather than replaces. `run-agent-session` advances
      # through the list only when a model is unavailable to the calling
      # identity -- never after a real failure -- so a list is what keeps an
      # unavailable model from ending the run. A single id here would turn
      # every availability gap into a dead job.
      #
      # Each list also ascends from its starting tier, where the unlabelled
      # default descends. That asymmetry is deliberate: the default starts
      # at the top and has nowhere to go but down, while a tier is a floor
      # someone chose, and falling below it would silently run a task on
      # less model than was asked for. Unavailability should cost money,
      # not correctness.
      - name: Resolve Implementor Model Tier
        id: tier
        if: steps.context.outputs.ok == 'true'
        env:
          VENDOR: ${{ steps.route.outputs.vendor }}
          # The list used when no per-task tier applies. Vendor-specific
          # for the same reason tier_models is: the ids do not transfer.
          DEFAULT_MODELS: >-
            ${{ steps.route.outputs.vendor == 'claude'
            && 'claude-haiku-4-5,claude-sonnet-5,claude-opus-5'
            || 'claude-haiku-4.5,claude-sonnet-5,claude-opus-5' }}
        shell: bash
        run: |
          set -euo pipefail

          rank() {
            case "$1" in
              haiku) echo 1 ;;
              sonnet) echo 2 ;;
              opus) echo 3 ;;
              *) echo 0 ;;
            esac
          }

          # Highest wins when an Issue carries more than one. Hand-relabelling
          # usually means adding the intended label and leaving the old one,
          # and reading that as "the cheaper of the two" would do the opposite
          # of what the person meant.
          TIER=""
          BEST=0

          while read -r label; do
            case "$label" in
              model:*) CANDIDATE="${label#model:}" ;;
              *) continue ;;
            esac

            CANDIDATE_RANK="$(rank "$CANDIDATE")"

            if [ "$CANDIDATE_RANK" -eq 0 ]; then
              echo "Ignoring unrecognised tier label: $label"
              continue
            fi

            if [ "$CANDIDATE_RANK" -gt "$BEST" ]; then
              BEST="$CANDIDATE_RANK"
              TIER="$CANDIDATE"
            fi
          done < <(jq -r '.labels[].name' issue.json)

          FLOOR_RANK="$(rank "$IMPLEMENTOR_TIER_FLOOR")"

          if [ "$FLOOR_RANK" -eq 0 ]; then
            echo "::warning::IMPLEMENTOR_TIER_FLOOR is" \
                 "'$IMPLEMENTOR_TIER_FLOOR', which is not a tier. Ignoring it."
            FLOOR_RANK=0
          fi

          if [ -n "$TIER" ] && [ "$BEST" -lt "$FLOOR_RANK" ]; then
            echo "Raising model:$TIER to the repository floor" \
                 "'$IMPLEMENTOR_TIER_FLOOR'."
            TIER="$IMPLEMENTOR_TIER_FLOOR"
          fi

          # A tier names a capability level; each vendor spells it its own
          # way. Copilot CLI: `claude-haiku-4.5`. Claude Code: the same model
          # is `claude-haiku-4-5`. Resolving the spelling here keeps the
          # escalation logic above vendor-blind, and keeps a `:claude` run
          # from walking a list of Copilot ids and then reporting that every
          # model was unavailable.
          tier_models() {
            case "$1:$VENDOR" in
              haiku:copilot)  echo "claude-haiku-4.5,claude-sonnet-5,claude-opus-5" ;;
              haiku:claude)   echo "claude-haiku-4-5,claude-sonnet-5,claude-opus-5" ;;
              sonnet:copilot) echo "claude-sonnet-5,claude-opus-5" ;;
              sonnet:claude)  echo "claude-sonnet-5,claude-opus-5" ;;
              opus:copilot)   echo "claude-opus-5,claude-opus-4.8,claude-opus-4.7,claude-sonnet-5" ;;
              opus:claude)    echo "claude-opus-5,claude-opus-4-8,claude-sonnet-5" ;;
              *)              echo "" ;;
            esac
          }

          if [ "$IMPLEMENTOR_MODELS_PINNED" = "true" ]; then
            MODELS="$DEFAULT_MODELS"
            REASON="IMPLEMENTOR_MODELS is set for this repository; the operator list wins over any per-task tier."
          elif [ -z "$TIER" ]; then
            MODELS="$DEFAULT_MODELS"
            REASON="No model:* label on this Issue; using the default list."
          else
            MODELS="$(tier_models "$TIER")"
            REASON="Planner recommended model:$TIER for this task."
          fi

          echo "models=$MODELS" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

          echo "$REASON"
          echo "Implementor model preference list: $MODELS"

      - name: Build Implementor Request
        if: >-
          steps.context.outputs.ok == 'true' &&
          steps.branch-check.outputs.exists != 'true'
        shell: python
        run: |
          import json
          import pathlib

          root = pathlib.Path(".")

          issue = json.loads(pathlib.Path("issue.json").read_text())

          sections = []

          # Same file the local `implementor` VS Code profile loads -- kept in
          # sync by hand, the way every agent role file here is.
          role = root / ".github/agents/02-implementor.agent.md"

          if role.exists():
              sections.append(
                  "# IMPLEMENTOR ROLE DEFINITION\n\n" + role.read_text(errors="replace")
              )
          else:
              raise RuntimeError("Missing .github/agents/02-implementor.agent.md")

          for filename in ("AGENTS.md", ".github/copilot-instructions.md"):
              path = root / filename

              if path.exists():
                  sections.append(
                      f"# REPOSITORY FILE: {filename}\n\n"
                      + path.read_text(errors="replace")[:20000]
                  )

          sections.append(
              "# IMPLEMENTATION TASK (AUTHORITATIVE WORK CONTRACT)\n\n"
              f"Number: #{issue['number']}\n"
              f"Title: {issue['title']}\n\n"
              f"{issue.get('body') or ''}"
          )

          context = "\n\n---\n\n".join(sections)

          prompt = f"""
          You are the implementation agent for Sword and Planet, running
          non-interactively from a GitHub Actions workflow against the
          Implementation Task Issue below.

          HARD RULES:

          - Implement the smallest change that satisfies the Issue's
            Acceptance Criteria. Do not broaden scope, redesign
            architecture, or implement adjacent work.
          - Run `.github/scripts/validate-godot.sh` before finishing.
          - Only run `git commit` if the implementation is complete and
            validation passes. Do NOT run `git push` or `gh pr create` --
            the workflow handles both itself, immediately after confirming
            your commit exists, and only then re-runs validation, applies
            formatting, and runs an automated review against the pull
            request it just opened.
          - If you must stop on an unresolved requirement or ambiguity, do
            not commit anything at all.

          Your final message must follow the "Completion Report" format in
          the role definition below exactly, with nothing before or after
          it.

          CONTEXT FOLLOWS.

          {context}
          """

          pathlib.Path("implementor-prompt.txt").write_text(prompt)

          print(f"Prompt built: {len(prompt)} chars")

      - name: Run Implementor Session
        if: >-
          steps.context.outputs.ok == 'true' &&
          steps.branch-check.outputs.exists != 'true'
        id: exec-session
        uses: ./.github/actions/run-agent-session
        with:
          # Explicit for now. Stage 3 replaces this literal with the vendor
          # segment of the `agent:{role}:{vendor}` label that triggered the run.
          vendor: ${{ steps.route.outputs.vendor }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt-file: implementor-prompt.txt
          models: ${{ steps.tier.outputs.models }}
          max-ai-credits: ${{ env.IMPLEMENTOR_MAX_AI_CREDITS }}
          # Needs to edit, run shell commands, and commit -- same tool set
          # as the fixer. Only sub-agent spawning stays excluded.
          capability: write
          step-label: "Executing"

      # Safety net for a session that made real changes but stopped short
      # of running `git commit` itself (for example it ran out of budget,
      # or simply forgot the hard rule above). Without this, that work is
      # discarded entirely: "Check For Commit" below treats any leftover
      # working-tree changes as a hard failure so a half-finished, unreviewed
      # diff never becomes a pull request under the implementor's name. Folding
      # it into a commit here instead means that work survives and gets
      # reviewed like any other implementation, while a session that
      # committed nothing at all is unaffected (git commit is a no-op there,
      # by the `git status --porcelain` guard).
      - name: Commit Leftover Changes
        if: steps.context.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The implementor left uncommitted changes;" \
                 "committing them so the work is not discarded."
            git add -A
            git commit -m "Apply uncommitted implementor changes"
          fi

      # Whether a commit exists is the only signal trusted here -- not the
      # session's own claims. A session that talks as if it finished but
      # left the tree dirty, or decided not to commit at all, does not get
      # a pull request just because it said so.
      - name: Check For Commit
        if: steps.context.outputs.ok == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The implementor left uncommitted changes instead of" \
                 "either committing a complete implementation or making no" \
                 "changes at all."
            git status --porcelain

            echo '{"reason":"uncommitted_changes",' \
                 '"headline":"The implementor left uncommitted changes instead of committing or making no changes",' \
                 '"guidance":"This is a session-behavior fault, not a budget or availability one. Re-adding agent:execute retries from a clean branch."}' \
              > implementor-failure.json

            echo "made=false" >> "$GITHUB_OUTPUT"
            echo "reason=uncommitted_changes" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          NEW_SHA=$(git rev-parse HEAD)

          if [ "$NEW_SHA" = "$BASE_SHA" ]; then
            echo "::warning::No commit was made. The implementor did not" \
                 "produce an implementation."
            echo "made=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "made=true" >> "$GITHUB_OUTPUT"

      # Runs immediately after the implementor's commit is confirmed, before
      # validation, formatting, or the pre-PR review-and-fix pass -- see the
      # rationale block at the top of this file.
      #
      # The pull request body only ever carries the implementor's own
      # completion report -- the same shape a human-run or cloud-agent
      # session's body would have. The review verdict is NOT written here;
      # it goes to a comment in "Publish Pre-PR Review" further down, the
      # same place `agent-04-review.yml` posts it. Keeping `## Review` blank
      # here (never filled by this step) matches every other PR in this
      # repo: the verdict lives in the comment feed, not the body.
      - name: Push Branch and Open Pull Request
        if: steps.context.outputs.ok == 'true' && steps.commit.outputs.made == 'true'
        id: pr
        shell: python
        env:
          EXEC_TEXT_FILE: ${{ steps.exec-session.outputs.final-text-file }}
          IMPLEMENTOR_MODEL: ${{ steps.exec-session.outputs.resolved-model }}
          BRANCH_RESUMED: ${{ steps.branch-check.outputs.exists }}
        run: |
          import json
          import os
          import pathlib
          import subprocess

          issue_number = os.environ["ISSUE_NUMBER"]
          branch = os.environ["BRANCH"]
          pr_title = os.environ["PR_TITLE"]
          repo = os.environ["GITHUB_REPOSITORY"]
          resumed = os.environ.get("BRANCH_RESUMED") == "true"

          def read(path):
              p = pathlib.Path(path) if path else None
              return p.read_text(errors="replace").strip() if p and p.exists() else ""

          # When resumed, "Run Implementor Session" never ran this pass -- the
          # implementation commit and its report belong to whichever earlier
          # run pushed $BRANCH. Say that plainly instead of falling back to
          # the generic "no final report" wording, which would read as if
          # something went wrong this run.
          if resumed:
              exec_report = (
                  "Resumed from a branch already pushed by a previous run of"
                  " this workflow -- the implementor session was skipped this"
                  " time. The implementation commit and its completion"
                  " report belong to that earlier run; see its log for"
                  " details."
              )
          else:
              exec_report = read(os.environ.get("EXEC_TEXT_FILE")) or (
                  "The implementor pushed a commit but produced no final report."
                  " Inspect the diff directly."
              )

          implementor_model = os.environ.get("IMPLEMENTOR_MODEL") or (
              "unknown (resumed from a previous run)" if resumed else ""
          )

          # The implementor's completion report is the session's own account
          # of what it did, and nothing downstream verifies its claims --
          # a session that skipped validation and said so, or one that
          # claimed a passing run it never made, both produce a body that
          # reads the same. So the body leads with a slot only this
          # workflow ever writes ("Record Verified Validation", below),
          # and the report follows it as commentary. Until that step fills
          # the slot in, the placeholder says plainly that nothing has
          # been verified yet -- and the pull request stays a draft.
          validation_placeholder = "\n".join([
              "<!-- agent-execute-validation-record -->",
              "## Workflow-verified validation",
              "",
              "**Not yet recorded.** This pull request opened as a draft"
              " immediately after the implementor's commit, before the"
              " workflow ran `.github/scripts/validate-godot.sh` itself."
              " It is marked ready for review only once that run passes.",
              "",
              "Nothing below this section is evidence that validation ran:"
              " the completion report is the implementor session's own"
              " account, unverified.",
              "<!-- /agent-execute-validation-record -->",
          ])

          lines = [
              f"Closes #{issue_number}",
              "",
              validation_placeholder,
              "",
              exec_report,
              "",
              "## Review",
              "",
              "```",
              "VERDICT:",
              "```",
          ]

          pathlib.Path("pr-body.md").write_text("\n".join(lines) + "\n")

          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)

          base = subprocess.run(
              ["gh", "repo", "view", repo, "--json", "defaultBranchRef",
               "--jq", ".defaultBranchRef.name"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          # Opened as a draft on purpose. The commit behind it may be one
          # the implementor itself refused to make: "Commit Leftover Changes"
          # above deliberately rescues an unfinished session's work rather
          # than discarding it, which means the pull request can exist for
          # code the implementor stopped short of validating -- exactly the
          # case its own hard rules tell it not to commit. Draft is how
          # that distinction survives into something a human can see:
          # "Record Verified Validation" marks it ready only after this
          # workflow's own `validate-godot.sh` run passes against the
          # commit the branch actually points at. A pull request still
          # sitting in draft is one no verified validation stands behind.
          #
          # This costs nothing in the dashboard or the saved views: both
          # already read draft as "Implementing" and ready as "Awaiting
          # review" (see docs/AGENT_WORKFLOW.md), which is precisely the
          # distinction being drawn here.
          def create_pr(draft):
              command = ["gh", "pr", "create", "--repo", repo, "--base", base,
                         "--head", branch, "--title", pr_title,
                         "--body-file", "pr-body.md"]

              if draft:
                  command.append("--draft")

              return subprocess.run(command, capture_output=True, text=True)

          create = create_pr(draft=True)

          # Draft pull requests are not available on every plan/visibility
          # combination. Losing the draft gate is worth strictly less than
          # losing the pull request, so fall back rather than fail -- the
          # verified-validation section still lands in the body either
          # way, which is the part that carries the actual evidence.
          if create.returncode != 0:
              print(create.stderr)
              print(
                  "::warning::Opening the pull request as a draft failed."
                  " Retrying without --draft; the ready-for-review gate on"
                  " verified validation will not apply to this pull"
                  " request, though its validation record still will."
              )
              create = create_pr(draft=False)

          # The branch is already pushed at this point, so a failure here
          # must not surface as an opaque, uncaught CalledProcessError --
          # that hides the one thing worth knowing (gh's actual stderr,
          # e.g. "GitHub Actions is not permitted to create or approve
          # pull requests" when the repo's Actions settings disallow it)
          # behind a bare traceback, and leaves `implementor-failure.json`
          # unwritten so "Report Execution Failure" below falls back to
          # "unknown". Print gh's own output and fail the same
          # diagnosable way every other step in this job does.
          if create.returncode != 0:
              print(create.stdout)
              print(create.stderr)

              print(
                  "::error::gh pr create failed after the branch was "
                  "already pushed. See gh's output above for the reason "
                  "(a common cause is the repository's Settings > Actions "
                  "> General > Workflow permissions not allowing GitHub "
                  "Actions to create pull requests)."
              )

              pathlib.Path("implementor-failure.json").write_text(
                  json.dumps({
                      "reason": "pr_create_failed",
                      "headline": "gh pr create failed after the branch was pushed",
                      "guidance": (
                          f"Branch `{branch}` was pushed successfully, but "
                          "`gh pr create` failed -- see the run log for "
                          "gh's exact error. A common cause is the "
                          "repository's Settings > Actions > General > "
                          "Workflow permissions not allowing GitHub "
                          "Actions to create pull requests. The branch "
                          "still exists, so a pull request can be opened "
                          "manually from it, or `agent:execute` can be "
                          "retried once the cause is fixed."
                      ),
                  })
              )

              raise SystemExit(1)

          pr_url = create.stdout.strip().splitlines()[-1]

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"pr_url={pr_url}\n")

          subprocess.run(
              ["gh", "issue", "comment", issue_number, "--repo", repo,
               "--body",
               f"Opened {pr_url} via `.github/agents/02-implementor.agent.md`"
               f" on `{implementor_model}`."],
              check=True,
          )

          subprocess.run(
              ["gh", "issue", "edit", issue_number, "--repo", repo,
               "--remove-label", os.environ.get("TRIGGER_LABEL") or "agent:execute"],
              check=False,
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Execute Task\n\nOpened {pr_url}.\n")

      # Deliberately does not fail the step on a nonzero validation exit: a
      # validation failure is an expected, well-handled outcome here (see
      # "Report Validation Failure" below), not an infrastructure fault. If
      # this step failed the job, the generic "Report Execution Failure"
      # step would fire in addition to the specific one and double-comment.
      - name: Re-run Validation
        if: steps.context.outputs.ok == 'true' && steps.commit.outputs.made == 'true'
        id: validate
        shell: bash
        run: |
          set -uo pipefail

          # GitHub Actions invokes `shell: bash` steps with `-e` already
          # active (bash --noprofile --norc -e -o pipefail {0}), regardless
          # of this script's own `set` line -- `set -uo pipefail` cannot
          # unset a flag it never named. Without `|| status=$?` here, a
          # nonzero exit from validate-godot.sh would abort this step
          # immediately, before `status` is ever assigned, skipping the
          # warning below and the "Report Validation Failure" step
          # entirely (its condition needs a real status value to match).
          status=0
          .github/scripts/validate-godot.sh > validate-output.txt 2>&1 \
            || status=$?

          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::warning::validate-godot.sh failed with exit $status." \
                 "Formatting, the pre-PR review, and the pre-PR fix pass" \
                 "will all be skipped; the already-open pull request is" \
                 "unaffected."
            tail -c 4000 validate-output.txt
          fi

      # Best-effort, like the review-and-fix section below: a lint-tooling
      # hiccup must degrade to "skip formatting" rather than fail the job.
      # Runs before "Prepare Diff and Draft Title" so IMPL_SHA and
      # implement-diff.txt both include any formatting commit -- the pre-PR
      # review sees the final, formatted diff, and a later FIX-but-not-
      # applied reset lands back on formatted code, not unformatted code.
      - name: List Changed GDScript Files
        if: steps.context.outputs.ok == 'true' && steps.commit.outputs.made == 'true' && steps.validate.outputs.status == '0'
        id: gd-files
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only "$BASE_SHA" HEAD -- '*.gd' > changed-gd-files.txt || true

          echo "Changed GDScript files:"
          cat changed-gd-files.txt || echo "(none)"

      - name: Apply GDScript Formatting
        if: steps.gd-files.outcome == 'success'
        id: format
        continue-on-error: true
        uses: ./.github/actions/lint-gdscript
        with:
          mode: fix
          files-list-file: changed-gd-files.txt

      - name: Commit Formatting Fixes
        if: steps.format.outcome == 'success' && steps.format.outputs.formatted == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          git add -u -- '*.gd'
          git commit -m "style: apply gdformat"

          # gdformat shouldn't change behavior, but this is a cheap safety
          # net: if it somehow did, drop the formatting commit and continue
          # unformatted rather than block the whole task on a formatter
          # edge case.
          if ! .github/scripts/validate-godot.sh > format-validate-output.txt 2>&1; then
            echo "::warning::Validation failed after applying gdformat." \
                 "Reverting the formatting commit and continuing unformatted."
            tail -c 4000 format-validate-output.txt
            git reset --hard HEAD~1
          else
            # The pull request already exists by this point (it opened
            # right after the implementor's commit, before this formatting
            # pass ran) -- push the formatting commit so the branch behind
            # it actually reflects it, instead of leaving it stranded on
            # the runner's local clone.
            git push origin "HEAD:$BRANCH"
          fi

      # From here on, the pull request is already open (it opened right
      # after "Check For Commit", above) -- everything below is a
      # best-effort follow-up against it. Keeping the review-and-fix
      # section's steps `continue-on-error: true` throughout is what lets a
      # failure anywhere in it fail softly, leaving the already-open pull
      # request as-is, rather than failing the job.
      - name: Prepare Diff and Draft Title
        if: >-
          steps.context.outputs.ok == 'true' &&
          steps.commit.outputs.made == 'true' &&
          steps.validate.outputs.status == '0'
        id: prep
        shell: bash
        run: |
          set -euo pipefail

          echo "IMPL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          git diff "$BASE_SHA" HEAD > implement-diff.txt

      # continue-on-error throughout this whole review-and-fix section:
      # every step in it is best-effort. A hiccup anywhere here (not just a
      # model failure -- a `gh` API blip counts too) must degrade to
      # leaving the already-open pull request unreviewed, never to failing
      # the job and discarding a working implementation. "Evaluate Pre-PR
      # Review" and "Evaluate Pre-PR Fix" are what actually decide what
      # happens next; every other step here just feeds them.
      - name: Build Pre-PR Review Request
        if: steps.prep.outcome == 'success'
        id: review-build
        continue-on-error: true
        uses: ./.github/actions/build-review-request
        with:
          mode: diff
          issue-number: ${{ env.ISSUE_NUMBER }}
          diff-file: implement-diff.txt
          pr-title: ${{ env.PR_TITLE }}
          pr-branch: ${{ env.BRANCH }}
          max-diff-chars: ${{ env.MAX_DIFF_CHARS }}
          lint-report-file: >-
            ${{ steps.format.outcome == 'success' && steps.format.outputs.report-file || '' }}

      # continue-on-error: the pre-PR review is best-effort. A budget or
      # availability failure here must not throw away a working
      # implementation -- see "Evaluate Pre-PR Review" below, which is what
      # actually decides what happens next.
      - name: Run Pre-PR Review Session
        if: steps.prep.outcome == 'success'
        id: review-session
        continue-on-error: true
        uses: ./.github/actions/run-agent-session
        with:
          # Explicit for now. Stage 3 replaces this literal with the vendor
          # segment of the `agent:{role}:{vendor}` label that triggered the run.
          vendor: ${{ steps.route.outputs.vendor }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt-file: ${{ steps.review-build.outputs.prompt-file }}
          models: ${{ env.REVIEWER_MODELS }}
          max-ai-credits: ${{ env.REVIEWER_MAX_AI_CREDITS }}
          capability: read-only
          step-label: "Reviewing (pre-PR)"

      - name: Extract Pre-PR Review Verdict
        if: steps.prep.outcome == 'success'
        id: review-verdict
        continue-on-error: true
        uses: ./.github/actions/extract-review-verdict
        with:
          assistant-text-file: ${{ steps.review-session.outputs.assistant-text-file }}
          outcome-file: ${{ steps.review-session.outputs.outcome-file }}

      - name: Evaluate Pre-PR Review
        if: steps.prep.outcome == 'success'
        id: review-eval
        continue-on-error: true
        shell: bash
        env:
          SESSION_OUTCOME: ${{ steps.review-session.outcome }}
          VERDICT_OUTCOME: ${{ steps.review-verdict.outcome }}
          VERDICT: ${{ steps.review-verdict.outputs.verdict }}
        run: |
          set -euo pipefail

          if [ "$SESSION_OUTCOME" = "success" ] && [ "$VERDICT_OUTCOME" = "success" ]; then
            echo "review_ok=true" >> "$GITHUB_OUTPUT"
            echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The pre-PR review did not complete" \
                 "(session outcome: $SESSION_OUTCOME, verdict outcome:" \
                 "$VERDICT_OUTCOME). Opening the pull request unreviewed" \
                 "instead of discarding the implementation."
            echo "review_ok=false" >> "$GITHUB_OUTPUT"
            echo "verdict=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Pre-PR Fix Request
        if: >-
          steps.review-eval.outputs.review_ok == 'true' &&
          steps.review-eval.outputs.verdict == 'FIX'
        id: fix-build
        continue-on-error: true
        uses: ./.github/actions/build-fix-request
        with:
          mode: diff
          issue-number: ${{ env.ISSUE_NUMBER }}
          diff-file: implement-diff.txt
          verdict-file: ${{ steps.review-verdict.outputs.review-file }}
          pr-title: ${{ env.PR_TITLE }}
          pr-branch: ${{ env.BRANCH }}
          max-diff-chars: ${{ env.MAX_DIFF_CHARS }}

      # continue-on-error for the same reason as the review session: a
      # failed fix attempt must fall back to leaving the already-open pull
      # request unfixed and labeled review:fix, not lose the implementation
      # entirely.
      - name: Run Pre-PR Fix Session
        if: steps.fix-build.outcome == 'success'
        id: fix-session
        continue-on-error: true
        uses: ./.github/actions/run-agent-session
        with:
          # Explicit for now. Stage 3 replaces this literal with the vendor
          # segment of the `agent:{role}:{vendor}` label that triggered the run.
          vendor: ${{ steps.route.outputs.vendor }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt-file: ${{ steps.fix-build.outputs.prompt-file }}
          models: ${{ env.FIXER_MODELS }}
          max-ai-credits: ${{ env.FIXER_MAX_AI_CREDITS }}
          capability: write
          step-label: "Fixing (pre-PR)"

      # A single bounded pass, exactly like agent-05-fix.yml: this either
      # leaves a clean, validated fix commit on top of IMPL_SHA and pushes
      # it onto the already-open pull request's branch, or resets straight
      # back to IMPL_SHA and leaves the remote as-is (it already matches
      # IMPL_SHA, from the push in "Push Branch and Open Pull Request" or
      # "Commit Formatting Fixes") -- either way the branch behind the pull
      # request ends up matching whatever happened here.
      - name: Evaluate Pre-PR Fix
        if: steps.fix-build.outcome == 'success'
        id: fix-eval
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::The pre-PR fix left uncommitted changes." \
                 "Discarding them; the already-open pull request stays" \
                 "unfixed."
            git checkout -- .
            git clean -fd
            echo "fix_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_SHA=$(git rev-parse HEAD)

          if [ "$NEW_SHA" = "$IMPL_SHA" ]; then
            echo "No fix commit was made."
            echo "fix_applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if .github/scripts/validate-godot.sh > fix-validate-output.txt 2>&1; then
            # The pull request is already open (it opened right after the
            # implementor's commit, long before this fix pass ran) -- push the
            # fix commit so the branch behind it actually reflects the fix
            # instead of leaving it stranded on the runner's local clone.
            git push origin "HEAD:$BRANCH"
            echo "fix_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The pre-PR fix commit failed validation." \
                 "Resetting to the pre-fix implementation; the" \
                 "already-open pull request stays unfixed."
            tail -c 4000 fix-validate-output.txt
            git reset --hard "$IMPL_SHA"
            echo "fix_applied=false" >> "$GITHUB_OUTPUT"
          fi

      # The one place a validation result reaches the pull request as
      # fact rather than as an agent's claim.
      #
      # Every other statement about validation on an implementor pull request
      # is a session talking about itself: the implementor's completion
      # report becomes the body verbatim, and the pre-PR review and fix
      # comments are written by sessions too. None of that is checked
      # against anything. A session that skipped validation, a session
      # that ran it and passed, and a session that simply said it passed
      # all produce prose of the same shape -- and the reader has no way
      # to tell them apart.
      #
      # So this runs `validate-godot.sh` once more, last, against the
      # commit the remote branch actually points at, and writes the exit
      # status into the body slot reserved for it. Deliberately a fresh
      # run rather than a reuse of `steps.validate.outputs.status`: that
      # one measured the implementor's commit, and formatting and the pre-PR
      # fix pass can both have moved the branch since.
      #
      # Runs under `always()` because a validation failure upstream skips
      # the whole review-and-fix pass -- that is precisely the case where
      # the body must not be left claiming nothing was checked when it
      # was, or vice versa. `continue-on-error` keeps it from turning a
      # working pull request into a failed job.
      - name: Record Verified Validation
        if: >-
          always() &&
          steps.context.outputs.ok == 'true' &&
          steps.commit.outputs.made == 'true' &&
          steps.pr.outcome == 'success'
        continue-on-error: true
        shell: python
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          import os
          import pathlib
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH"]
          run_url = os.environ["RUN_URL"]
          # `steps.pr.outcome == 'success'` should guarantee a URL here, but
          # this step runs under always() and is the one place a validation
          # result is recorded -- failing on an empty PR_URL would swallow
          # that silently behind continue-on-error, which is the exact
          # failure mode this step exists to remove.
          pr_match = re.search(r"(\d+)$", os.environ.get("PR_URL") or "")

          if pr_match is None:
              print(
                  "::warning::No pull request URL is available, so the"
                  " verified validation result cannot be recorded on one."
              )
              raise SystemExit(0)

          pr_number = pr_match.group(1)

          MARKER_OPEN = "<!-- agent-execute-validation-record -->"
          MARKER_CLOSE = "<!-- /agent-execute-validation-record -->"

          # Kept in sync by hand with render-dashboard.py's VALIDATION_FAILED.
          VALIDATION_FAILED = "validation:failed"

          log = pathlib.Path("verified-validate-output.txt")

          with log.open("wb") as handle:
              status = subprocess.run(
                  [".github/scripts/validate-godot.sh"],
                  stdout=handle, stderr=subprocess.STDOUT,
              ).returncode

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True,
              ).stdout.strip()

          # What was validated is the runner's working tree; what a
          # reviewer will read is whatever the branch points at. Those are
          # the same thing on every path through this job -- but "the same
          # thing on every path I can think of" is exactly the assumption
          # this whole step exists to stop trusting, so check it and say
          # so when it does not hold.
          local_sha = git("rev-parse", "HEAD")
          remote_line = git("ls-remote", "origin", f"refs/heads/{branch}")
          remote_sha = remote_line.split()[0] if remote_line else ""

          in_sync = remote_sha == local_sha
          verified = status == 0 and in_sync

          if not in_sync:
              headline = (
                  f"**Not verified.** The workflow validated `{local_sha}`,"
                  f" but `{branch}` points at"
                  f" `{remote_sha or 'nothing'}` -- so this run says"
                  " nothing about the code in this pull request."
              )
          elif status == 0:
              headline = (
                  "`.github/scripts/validate-godot.sh` — **passed** (exit"
                  f" 0), run against `{local_sha}`, the commit"
                  f" `{branch}` points at."
              )
          else:
              headline = (
                  "`.github/scripts/validate-godot.sh` — **failed** (exit"
                  f" {status}), run against `{local_sha}`, the commit"
                  f" `{branch}` points at."
              )

          raw = log.read_text(errors="replace") if log.exists() else ""
          tail = raw[-4000:]

          # A byte-count tail lands mid-line, so the block would open on a
          # fragment like "ilities/moba_ability_library.gd:53)". Drop that
          # partial line -- but only when the cap actually cut something.
          #
          # Gating on truncation rather than on line count is the whole
          # point: a log shorter than the cap has a *complete* first line,
          # and the shortest logs are the ones where it matters most.
          # `validate-godot.sh` failing to find Godot prints three lines, the
          # first of which is the only one that says what went wrong.
          #
          # Never empties the block: if dropping the line would leave
          # nothing (a single line longer than the cap), keep the fragment.
          if len(raw) > 4000:
              trimmed = tail.split("\n", 1)[1] if "\n" in tail else ""

              if trimmed.strip():
                  tail = trimmed

          # Godot output is arbitrary text and can contain a ``` sequence
          # (a GDScript doc comment quoting one is enough). Fence the block
          # with a run of backticks longer than anything inside it, per
          # CommonMark, instead of assuming three is safe.
          longest_run = max(
              (len(run) for run in re.findall(r"`+", tail)), default=0
          )
          fence = "`" * max(3, longest_run + 1)

          section = "\n".join([
              MARKER_OPEN,
              "## Workflow-verified validation",
              "",
              headline,
              "",
              "<details><summary>Validation output (tail)</summary>",
              "",
              fence,
              tail.strip(),
              fence,
              "",
              "</details>",
              "",
              "Written by `agent-02-implement.yml` itself, not by an agent"
              " session. Every other account of validation on this pull"
              " request -- the completion report included -- comes from a"
              " session describing its own work, and none of it was"
              " treated as evidence here.",
              "",
              f"[Workflow run]({run_url})",
              MARKER_CLOSE,
          ])

          body = subprocess.run(
              ["gh", "pr", "view", pr_number, "--repo", repo,
               "--json", "body", "--jq", ".body"],
              capture_output=True, text=True, check=True,
          ).stdout

          slot = re.compile(
              re.escape(MARKER_OPEN) + ".*?" + re.escape(MARKER_CLOSE),
              re.DOTALL,
          )

          # `lambda` rather than a plain replacement string: the section
          # is full of backslashes and backticks from the validation log,
          # and re.sub would read `\1` and friends in it as group
          # references.
          if slot.search(body):
              body = slot.sub(lambda _: section, body, count=1)
          else:
              body = body.rstrip() + "\n\n" + section + "\n"

          pathlib.Path("pr-body-verified.md").write_text(body + "\n")

          subprocess.run(
              ["gh", "pr", "edit", pr_number, "--repo", repo,
               "--body-file", "pr-body-verified.md"],
              check=True,
          )

          # Draft alone is not enough to mark a *failure*. Draft is also
          # what an in-flight session looks like, and the dashboard reads it
          # that way on purpose -- so a pull request left draft by a failed
          # validation would file itself under "Implementing" forever
          # instead of asking for a human. The label is what separates
          # "not finished yet" from "finished and broken";
          # render-dashboard.py tests it ahead of its draft rule.
          def set_validation_label(present):
              if present:
                  existing = subprocess.run(
                      ["gh", "label", "list", "--repo", repo, "--limit", "200",
                       "--json", "name", "--jq", ".[].name"],
                      capture_output=True, text=True, check=True,
                  ).stdout.splitlines()

                  if VALIDATION_FAILED not in existing:
                      subprocess.run(
                          ["gh", "label", "create", VALIDATION_FAILED,
                           "--repo", repo, "--color", "B60205",
                           "--description",
                           "The workflow's own validate-godot.sh run did not"
                           " pass on this branch"],
                          check=True,
                      )

              flag = "--add-label" if present else "--remove-label"

              # check=False on removal: a label that was never applied is
              # the normal case, not an error worth failing the step for.
              subprocess.run(
                  ["gh", "pr", "edit", pr_number, "--repo", repo,
                   flag, VALIDATION_FAILED],
                  check=present,
              )

          set_validation_label(not verified)

          if not verified:
              print(
                  "::warning::No verified validation stands behind this"
                  " pull request, so it stays a draft and is labeled"
                  f" `{VALIDATION_FAILED}`."
              )
              raise SystemExit(0)

          # `check=False`: the pull request is only a draft if `--draft`
          # was accepted when it opened, and `gh pr ready` errors on one
          # that never was. That is not a failure worth reporting -- the
          # body already carries the result either way.
          ready = subprocess.run(
              ["gh", "pr", "ready", pr_number, "--repo", repo],
              capture_output=True, text=True,
          )

          if ready.returncode != 0:
              print(ready.stderr)

      # Last word on what this run actually pushed, for the independent
      # validation job below.
      #
      # Read from the remote rather than `git rev-parse HEAD`, and read here
      # rather than earlier, because the branch moves up to three times in
      # this job: the implementor's commit, a gdformat commit, and a pre-PR fix
      # commit. Two of those can also be rolled back locally (`git reset
      # --hard`) after a failed re-validation, so the runner's HEAD and the
      # remote tip are not reliably the same thing. The commit a reviewer
      # will see is the one on the remote, so that is the one to validate.
      #
      # `always()` because the steps above it are best-effort: a soft-failed
      # review or fix pass still leaves a real pushed commit that deserves
      # validating. `continue-on-error` because failing to *describe* the
      # push must not fail a run whose work already landed.
      - name: Resolve Pushed Head For Validation
        if: >-
          always() &&
          steps.context.outputs.ok == 'true' &&
          steps.commit.outputs.made == 'true' &&
          steps.pr.outcome == 'success'
        id: pushed
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail

          remote_sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)

          if [ -z "$remote_sha" ]; then
            echo "::warning::No remote tip found for $BRANCH; the" \
                 "independent validation job will be skipped."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Pushed head for $BRANCH is $remote_sha."
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$remote_sha" >> "$GITHUB_OUTPUT"

      # Best-effort: the pull request is already open by this point (it
      # opened right after the implementor's commit, well before this step),
      # so anything failing here must never turn into a job failure -- the
      # pull request itself is unaffected either way.
      #
      # Gated on validation having actually succeeded: when "Re-run
      # Validation" fails, the whole review-and-fix pass below it never
      # runs at all, and "Report Validation Failure" is what tells the
      # pull request about that instead -- this step firing anyway would
      # misreport a validation failure as "the review did not complete
      # (budget, availability...)".
      #
      # This is deliberately the *only* place the pre-PR review's findings
      # ever reach GitHub as text. Whether that text is a real
      # `<!-- agent-review-verdict -->` comment (the exact format and
      # marker `agent-04-review.yml` posts, so `agent-05-fix.yml` and a
      # human both recognise it identically) depends on whether it's still
      # accurate for the code as pushed:
      #
      #   - review_ok false, or FIX-and-fixed: NOT posted as a verdict --
      #     either there is no verdict, or the code changed after the one
      #     that exists, so publishing it as *the* verdict would describe
      #     code that no longer exists. Both get a plainly-labeled
      #     informational comment instead, and no review:* label, so
      #     `agent:review` on this pull request is a first review, not a
      #     wasted repeat of one that already happened.
      #   - PASS / unfixed-FIX / PLANNING FAILURE / DESIGN AMBIGUITY: this
      #     verdict is still exactly what the current code would get from
      #     `agent-04-review.yml`, so it's posted as the real thing, label
      #     included. Re-adding `agent:review` here would be paying for a
      #     second opinion on unchanged code -- the label already visible
      #     on the pull request is the signal that already happened.
      - name: Publish Pre-PR Review
        if: steps.pr.outcome == 'success' && steps.validate.outputs.status == '0'
        continue-on-error: true
        shell: python
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          REVIEW_OK: ${{ steps.review-eval.outputs.review_ok }}
          VERDICT: ${{ steps.review-eval.outputs.verdict }}
          REVIEW_FILE: ${{ steps.review-verdict.outputs.review-file }}
          REVIEWER_MODEL: ${{ steps.review-session.outputs.resolved-model }}
          FIX_APPLIED: ${{ steps.fix-eval.outputs.fix_applied }}
          FIX_TEXT_FILE: ${{ steps.fix-session.outputs.final-text-file }}
          FIXER_MODEL: ${{ steps.fix-session.outputs.resolved-model }}
        run: |
          import os
          import pathlib
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_url = os.environ["PR_URL"]
          pr_number = re.search(r"(\d+)$", pr_url).group(1)

          def read(path):
              p = pathlib.Path(path) if path else None
              return p.read_text(errors="replace").strip() if p and p.exists() else ""

          review_ok = os.environ["REVIEW_OK"] == "true"
          verdict = os.environ["VERDICT"]
          fix_applied = os.environ.get("FIX_APPLIED") == "true"
          reviewer_model = os.environ.get("REVIEWER_MODEL") or ""

          label = ""

          if not review_ok:
              body = (
                  "<!-- agent-execute-review-failed -->\n\n"
                  "## Pre-PR review did not complete\n\n"
                  "The automated review run for this pull request did not"
                  " finish (budget, availability, or a malformed response)"
                  " -- see the workflow run log. This pull request has not"
                  " been reviewed at all yet. Add `agent:review` for a"
                  " first pass."
              )
          elif verdict == "FIX" and fix_applied:
              fix_report = read(os.environ.get("FIX_TEXT_FILE")) or (
                  "No final report was produced."
              )

              body = (
                  "<!-- agent-fix-applied -->\n\n"
                  "## Automated Fix Applied\n\n"
                  f"Reviewed after this pull request opened (on"
                  f" `{reviewer_model}`) and found issues that were fixed"
                  f" automatically (on"
                  f" `{os.environ.get('FIXER_MODEL') or ''}`).\n\n"
                  "<details><summary>Original findings</summary>\n\n"
                  f"{read(os.environ['REVIEW_FILE'])}\n\n"
                  "</details>\n\n"
                  "<details><summary>Fix applied</summary>\n\n"
                  f"{fix_report}\n\n"
                  "</details>\n\n"
                  "The code changed after the review above, so it has not"
                  " been re-reviewed as-is. Add `agent:review` for a fresh"
                  " verdict."
              )
          else:
              note = (
                  "\n\nAn automatic fix was attempted and did not land"
                  " cleanly, so this pull request is unfixed."
                  if verdict == "FIX"
                  else ""
              )

              body = (
                  "<!-- agent-review-verdict -->\n\n"
                  f"## Automated Review — `{verdict}`\n\n"
                  f"{read(os.environ['REVIEW_FILE'])}{note}\n\n"
                  "---\n\n"
                  "Reviewed by `.github/agents/03-reviewer.agent.md` via"
                  f" `agent-02-implement.yml`'s pre-PR pass on"
                  f" `{reviewer_model}`.\n"
                  "Re-run by adding the `agent:review` label."
              )

              label = {
                  "PASS": "review:pass",
                  "FIX": "review:fix",
                  "PLANNING FAILURE": "review:planning-failure",
                  "DESIGN AMBIGUITY": "review:design-ambiguity",
              }.get(verdict, "")

          subprocess.run(
              ["gh", "pr", "comment", pr_number, "--repo", repo, "--body", body],
              check=True,
          )

          if label:
              LABELS = {
                  "review:pass": ("0E8A16", "Automated review returned PASS"),
                  "review:fix": ("D93F0B", "Automated review returned FIX"),
                  "review:planning-failure": (
                      "B60205", "Automated review returned PLANNING FAILURE"
                  ),
                  "review:design-ambiguity": (
                      "FBCA04", "Automated review returned DESIGN AMBIGUITY"
                  ),
              }
              color, description = LABELS[label]

              existing = subprocess.run(
                  ["gh", "label", "list", "--repo", repo, "--limit", "200",
                   "--json", "name", "--jq", ".[].name"],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()

              if label not in existing:
                  subprocess.run(
                      ["gh", "label", "create", label, "--repo", repo,
                       "--color", color, "--description", description],
                      check=True,
                  )

              subprocess.run(
                  ["gh", "pr", "edit", pr_number, "--repo", repo,
                   "--add-label", label],
                  check=True,
              )

      - name: Report No Commit Produced
        if: >-
          steps.context.outputs.ok == 'true' &&
          steps.commit.outputs.made == 'false' &&
          steps.commit.outputs.reason == 'no_commit'
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "<!-- agent-execute-no-commit -->"
            echo ""
            echo "## Automated execution produced no implementation"
            echo ""
            echo "The implementor session completed without committing anything."
            echo "It may have stopped on an unresolved requirement or"
            echo "ambiguity -- check the session log for its explanation:"
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > no-commit-comment.md

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file no-commit-comment.md

          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "${TRIGGER_LABEL:-agent:execute}" || true

      # The pull request already exists by this point (opened right after
      # the implementor's commit, before validation ever ran), so this posts
      # to the pull request itself rather than the Issue -- that's where
      # someone picking this up will be working, and it's the same place
      # "Publish Pre-PR Review" would have posted to had validation
      # succeeded. `agent:execute` was already removed from the Issue by
      # "Push Branch and Open Pull Request", so there's nothing left to
      # clean up there.
      - name: Report Validation Failure
        if: >-
          steps.context.outputs.ok == 'true' &&
          steps.commit.outputs.made == 'true' &&
          steps.validate.outputs.status != '0' &&
          steps.validate.outputs.status != ''
        shell: bash
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          {
            echo "<!-- agent-execute-validation-failed -->"
            echo ""
            echo "## Automated validation failed after this pull request opened"
            echo ""
            echo "\`.github/scripts/validate-godot.sh\` failed when the"
            echo "workflow re-ran it after opening this pull request."
            echo "Formatting, the automated pre-PR review, and the"
            echo "automated fix pass were all skipped as a result -- this"
            echo "pull request has not been reviewed at all yet."
            echo ""
            echo '<details><summary>Validation output (tail)</summary>'
            echo ""
            echo '```'
            tail -c 4000 validate-output.txt
            echo '```'
            echo ""
            echo '</details>'
            echo ""
            echo "Full run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > validation-failed-comment.md

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file validation-failed-comment.md

      # Deliberately just `failure()`, not also gated on the guard check
      # having passed: a hard crash in "Resolve Implementation Task Issue"
      # itself (bad issue number, a `gh` API blip) exits nonzero before
      # `ok` is ever set, and that must still produce a comment rather than
      # a silent red run with no trace anywhere.
      #
      # A pull request can already exist by the time this fires: it opens
      # right after the implementor's commit, well before validation,
      # formatting, or review ever run, and one of those steps (e.g.
      # "Prepare Diff and Draft Title", which has no continue-on-error)
      # failing outright still fails the job. PR_URL distinguishes that
      # case -- a real, usable pull request left behind despite the
      # failure -- from every earlier failure path, where PR_URL is empty
      # because "Push Branch and Open Pull Request" never got there.
      - name: Report Execution Failure
        if: failure()
        shell: python
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          run_url = os.environ["RUN_URL"]
          pr_url = os.environ.get("PR_URL") or ""

          failure = {}

          for candidate in ("implementor-failure.json", "agent-session-failure.json"):
              path = pathlib.Path(candidate)

              if path.exists():
                  try:
                      failure = json.loads(path.read_text())
                  except json.JSONDecodeError:
                      failure = {}
                  break

          reason = failure.get("reason", "unknown")

          lines = [
              "<!-- agent-execute-failed -->",
              "",
              "## Automated execution did not complete",
              "",
          ]

          if pr_url:
              lines += [
                  f"A pull request was already open ({pr_url}) when this"
                  " failure happened, so it still exists -- only whatever"
                  " ran after it (validation, formatting, the automated"
                  " review, or the fix pass) is what failed here.",
                  "",
              ]
          else:
              lines += [
                  "**No pull request was opened.**",
                  "",
              ]

          if failure:
              lines += [
                  f"**{failure.get('headline', 'The execution run failed')}**",
                  "",
                  f"Reason: `{reason}`",
                  "",
              ]

              guidance = failure.get("guidance")

              if guidance:
                  lines += [guidance, ""]
          elif not pr_url:
              lines += [
                  "The run failed outside the Copilot session -- resolving"
                  " the Issue, creating the branch, or pushing.",
                  "",
              ]

          if pr_url:
              retry_line = (
                  "Since a pull request already exists for this Issue,"
                  " re-adding `agent:execute` will just point back at it --"
                  f" use `agent:fix` on {pr_url} instead, or push directly"
                  " to address whatever failed."
              )
          else:
              retry_line = (
                  "`agent:execute` has been removed, so re-adding it is a"
                  " clean retry."
              )

          lines += [
              f"Full run log: {run_url}",
              "",
              retry_line,
          ]

          body = "\n".join(lines)

          subprocess.run(
              [
                  "gh", "issue", "comment", issue_number, "--repo", repo,
                  "--body", body,
              ],
              check=True,
          )

          subprocess.run(
              [
                  "gh", "issue", "edit", issue_number, "--repo", repo,
                  "--remove-label", "agent:execute",
              ],
              check=False,
          )

          if pr_url:
              pr_number = re.search(r"(\d+)$", pr_url).group(1)
              subprocess.run(
                  ["gh", "pr", "comment", pr_number, "--repo", repo,
                   "--body", body],
                  check=False,
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n" + body + "\n")

  # The independent check. Everything the `execute` job says about
  # validation, it says about its own work: it runs `validate-godot.sh` in
  # the same working tree the session just mutated, and writes the result
  # into a pull request body it also wrote. This job is the one measurement
  # in the pipeline that no session touches -- a fresh clone of the commit
  # the remote branch actually points at, validated by the same job
  # definition the human-authored `pull_request` gate uses, reported as a
  # check run on that commit.
  #
  # It exists because the `pull_request`-triggered gate has repeatedly failed
  # to fire for agent pushes, landing in `action_required` and never
  # executing (Issue #167). A job in this run needs no second trigger, so
  # there is nothing to sit behind and nothing to work around.
  #
  # `always()` because the tail of `execute` is deliberately best-effort: a
  # soft-failed review or fix pass, or an outright job failure after the
  # push, still leaves a real commit on the branch that a reviewer will read.
  # Those are exactly the runs where an unvalidated commit would otherwise
  # slip through unmeasured.
  #
  # It reports and nothing else. No branch deletion, no reset, no label
  # change, no pull request state change on failure -- a red check next to a
  # green pull request is a decision for a human, not for this job.
  validate-pushed-commit:
    name: Independent Validation (agent push)
    needs: execute
    if: always() && needs.execute.outputs.pushed == 'true'

    # Narrower than the workflow default on purpose. The called workflow
    # inherits what this job holds, and it only ever reads the tree and
    # writes one check run; `execute`'s own permissions are untouched.
    permissions:
      contents: read
      checks: write

    uses: ./.github/workflows/godot-validation.yml
    with:
      ref: ${{ needs.execute.outputs.pushed-sha }}
      head-sha: ${{ needs.execute.outputs.pushed-sha }}
      check-name: Godot Validation (agent-02 execute)
