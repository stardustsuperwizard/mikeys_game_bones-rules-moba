name: Review Task

# Reviews a Copilot implementation pull request against the Implementation
# Task Issue that authorizes it, and emits a machine-readable verdict.
#
# This runs as a Copilot CLI session rather than a cloud agent for the same
# reason the planner does: the cloud agent is built to produce a diff, and a
# reviewer must not. Tools capable of editing or executing are removed rather
# than merely discouraged.
#
# GitHub's built-in Copilot code review is complementary, not a replacement --
# it reviews code quality but does not check the diff against the Issue's
# acceptance criteria.

on:
  pull_request:
    types:
      - ready_for_review
      - labeled

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Task
    runs-on: ubuntu-latest

    # Automatic on a Copilot branch becoming ready; manual anywhere else via
    # the agent:review label, which works from the GitHub mobile apps.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'agent:review') ||
      (github.event.action == 'ready_for_review' &&
       startsWith(github.event.pull_request.head.ref, 'copilot/'))

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}


      # Review is the correctness gate, so it gets the strong model. This is
      # a *preference list*, not a single id — see the long note in
      # agent-01-planner.yml for why availability is per-identity and a
      # picker-visible model can still be refused to this job.
      #
      # Every entry stays in the strong tier; a cheap reviewer is worse than
      # no reviewer. Overridable via the REVIEWER_MODELS repository variable
      # (comma-separated); the older REVIEWER_MODEL is honoured first if set.
      REVIEWER_MODELS: >-
        ${{ vars.REVIEWER_MODELS
        || vars.REVIEWER_MODEL
        || 'claude-opus-5,claude-opus-4.8,claude-opus-4.7,claude-sonnet-5' }}

      # Soft cap for this review session. The Copilot CLI rejects any
      # value below 30 before it starts work, so 30 is the floor, not a
      # tuning choice.
      REVIEWER_MAX_AI_CREDITS: "30"

      # Reviewing a very large diff costs more than it is worth; past this
      # the diff is truncated and the verdict says so.
      MAX_DIFF_CHARS: "150000"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Resolve Pull Request and Task Contract
        id: context
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,headRefName,isDraft,files \
            > pr.json

          gh pr diff "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            > pr.diff

          # The Issue the PR closes is the authoritative work contract.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY##*/}"

          gh api graphql \
            -f owner="$OWNER" \
            -f name="$NAME" \
            -F number="$PR_NUMBER" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 10) {
                      nodes { number title url }
                    }
                  }
                }
              }
            ' \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes' \
            > closing-issues.json

          TASK_NUMBER=$(jq -r '.[0].number // empty' closing-issues.json)

          if [ -z "$TASK_NUMBER" ]; then
            echo "::warning::PR #$PR_NUMBER does not close any Issue." \
                 "There is no acceptance-criteria contract to review against."
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            echo '{}' > task.json
          else
            echo "has_task=true" >> "$GITHUB_OUTPUT"
            echo "task_number=$TASK_NUMBER" >> "$GITHUB_OUTPUT"

            gh issue view "$TASK_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,url,parent \
              > task.json

            echo "Reviewing PR #$PR_NUMBER against Task #$TASK_NUMBER"
          fi

          echo "pr_url=$(jq -r '.url' pr.json)" >> "$GITHUB_OUTPUT"

      - name: Build Reviewer Request
        shell: python
        run: |
          import json
          import os
          import pathlib

          root = pathlib.Path(".")
          max_diff = int(os.environ["MAX_DIFF_CHARS"])

          pr = json.loads(pathlib.Path("pr.json").read_text())
          task = json.loads(pathlib.Path("task.json").read_text())

          sections = []

          # The reviewer role definition is the same file used interactively
          # in VS Code, so the two paths cannot drift apart.
          role = root / ".github/agents/03-reviewer.agent.md"

          if role.exists():
              sections.append(
                  "# REVIEWER ROLE DEFINITION\n\n"
                  + role.read_text(errors="replace")
              )
          else:
              raise RuntimeError(
                  "Missing .github/agents/03-reviewer.agent.md"
              )

          for filename in ("AGENTS.md", ".github/copilot-instructions.md"):
              path = root / filename

              if path.exists():
                  sections.append(
                      f"# REPOSITORY FILE: {filename}\n\n"
                      + path.read_text(errors="replace")[:20000]
                  )

          if task:
              sections.append(
                  "# IMPLEMENTATION TASK (AUTHORITATIVE WORK CONTRACT)\n\n"
                  f"Number: #{task['number']}\n"
                  f"Title: {task['title']}\n\n"
                  f"{task.get('body') or ''}"
              )

              parent = task.get("parent")

              if parent:
                  sections.append(
                      "# PARENT FEATURE (CONTEXT ONLY)\n\n"
                      f"#{parent['number']} {parent['title']}\n\n"
                      "This does not expand the task's scope."
                  )

          else:
              sections.append(
                  "# IMPLEMENTATION TASK\n\n"
                  "This pull request does not close any Issue, so no "
                  "acceptance-criteria contract is available. Review "
                  "against repository conventions only and return "
                  "DESIGN AMBIGUITY if intent cannot be determined."
              )

          sections.append(
              "# PULL REQUEST\n\n"
              f"Number: #{pr['number']}\n"
              f"Title: {pr['title']}\n"
              f"Branch: {pr['headRefName']}\n\n"
              f"{pr.get('body') or ''}"
          )

          changed = "\n".join(
              f"- {entry['path']} "
              f"(+{entry['additions']}/-{entry['deletions']})"
              for entry in pr.get("files", [])
          )

          sections.append(
              f"# FILES CHANGED\n\n{changed or '- none'}"
          )

          diff = pathlib.Path("pr.diff").read_text(errors="replace")
          truncated = len(diff) > max_diff

          if truncated:
              diff = diff[:max_diff]

          sections.append(
              "# FINAL INTEGRATED DIFF\n\n"
              + ("**The diff was truncated. Say so in your reasoning and "
                 "do not return PASS on unreviewed content.**\n\n"
                 if truncated else "")
              + "```diff\n"
              + diff
              + "\n```"
          )

          context = "\n\n---\n\n".join(sections)

          prompt = f"""
          You are the review agent for Sword and Planet.

          You are NOT an implementation agent.

          Review the supplied pull request against the Implementation Task
          contract and report a verdict.

          HARD RULES:

          - Do not edit repository files.
          - Do not execute shell commands.
          - Do not create or modify GitHub Issues or comments yourself.
          - Do not implement fixes.
          - Do not review work the task explicitly places out of scope.
          - Do not invent requirements absent from the contract.
          - Judge completeness against the Acceptance Criteria, one by one.

          Your first line MUST be exactly one of:

          VERDICT: PASS
          VERDICT: FIX
          VERDICT: PLANNING FAILURE
          VERDICT: DESIGN AMBIGUITY

          After that line, output Markdown with these sections:

          ## Acceptance Criteria

          A table with columns: Criterion | Met | Evidence.
          Cite the file and change that satisfies each criterion, or state
          plainly that nothing in the diff satisfies it.

          ## Scope Adherence

          Note any change outside the task's stated scope or expected files,
          and any acceptance criterion left unimplemented.

          ## Findings

          Numbered, most serious first. Each finding gives the file, what is
          wrong, and why it matters. Write "None" if there are none.

          ## Required Before Merge

          Bullet list of what must change for this to become PASS.
          Write "Nothing" when the verdict is PASS.

          Be concise. Do not restate the diff.

          CONTEXT FOLLOWS.

          {context}
          """

          pathlib.Path("reviewer-prompt.txt").write_text(prompt)

          print(f"Prompt built: {len(prompt)} chars, truncated={truncated}")

      # Copilot CLI model ids are not published as a stable list; they are
      # shown in the --model help text. Dumping them costs nothing and means
      # a rejected id is self-diagnosing instead of a mystery failure.
      # The help text lists what the CLI supports, which is a superset of what
      # this workflow's identity is entitled to. Goes to the log as well as the
      # summary, because the summary is not where anyone looks when a job fails.
      - name: Show Available Models
        continue-on-error: true
        shell: bash
        run: |
          set +e

          copilot --version
          copilot --help 2>&1 | sed -n '/--model/,/^[[:space:]]*$/p' \
            > model-help.txt

          echo "Candidate models for this run: $REVIEWER_MODELS"
          cat model-help.txt

          {
            echo "<details><summary>Copilot CLI model ids</summary>"
            echo ""
            echo "Candidates tried in order: \`$REVIEWER_MODELS\`"
            echo ""
            echo '```'
            cat model-help.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Reviewer with Copilot CLI
        shell: bash
        run: |
          set -euo pipefail

          # Same capability-removal posture as the planner: the reviewer can
          # read the checkout but holds no tool that can change it.
          #
          # Same model-fallback posture too: an unavailable model is rejected
          # before billing, so walking the preference list is free.
          #
          # And the same outcome classification. Every attempt goes to
          # classify-copilot-outcome.py, which reads the exit status, stderr,
          # and event stream and names why the session ended. The reason
          # matters more here than it does for the planner: a review cut off
          # by its credit cap still carries its VERDICT line, because that
          # line comes first, so the only thing distinguishing a finished
          # review from a truncated one is the session verdict.

          if [ ! -f reviewer-prompt.txt ]; then
            echo "::error::reviewer-prompt.txt was not produced by the" \
                 "Build Reviewer Request step."
            exit 1
          fi

          resolved=""
          last_reason=""

          IFS=',' read -r -a candidates <<< "$REVIEWER_MODELS"

          for candidate in "${candidates[@]}"; do
            model="$(echo "$candidate" | tr -d '[:space:]')"
            [ -n "$model" ] || continue

            echo "::group::Reviewing with $model"

            status=0

            # The prompt goes on stdin, NOT via -p "$(cat ...)". Linux caps a
            # single argv element at MAX_ARG_STRLEN (32 pages = 128 KiB),
            # independently of the much larger total ARG_MAX. MAX_DIFF_CHARS
            # alone is 150000, so an argument-passed prompt fails execve()
            # with E2BIG ("Argument list too long", exit 126) before copilot
            # starts. Copilot CLI reads the prompt from stdin when -p is empty.
            copilot \
              -p "" \
              --model "$model" \
              --output-format json \
              --no-ask-user \
              --max-ai-credits "$REVIEWER_MAX_AI_CREDITS" \
              --allow-all-tools \
              --excluded-tools "bash,powershell,apply_patch,create,edit,task,write_agent" \
              < reviewer-prompt.txt \
              > copilot-output.jsonl 2> copilot-error.txt || status=$?

            echo "copilot exited $status"
            echo "output: $(wc -c < copilot-output.jsonl) bytes of JSONL"

            python3 .github/scripts/classify-copilot-outcome.py \
              --jsonl copilot-output.jsonl \
              --stderr copilot-error.txt \
              --exit-status "$status" \
              --model "$model" \
              --credit-limit "$REVIEWER_MAX_AI_CREDITS" \
              --out copilot-outcome.json

            reason="$(jq -r '.reason' copilot-outcome.json)"
            headline="$(jq -r '.headline' copilot-outcome.json)"
            guidance="$(jq -r '.guidance' copilot-outcome.json)"

            echo "::endgroup::"

            last_reason="$reason"

            if [ "$reason" = "model_unavailable" ]; then
              echo "::warning::$headline. Trying the next candidate."
              continue
            fi

            chars="$(jq -r '.assistant_text_chars' copilot-outcome.json)"

            # Anything that produced text goes forward, even a session that
            # ended badly. The credit cap is soft -- an in-flight response
            # finishes -- so a run can trip its budget and still return a
            # whole review. Whether what came back is a *complete* review is
            # the Extract Verdict step's question, asked in one place.
            if [ "$reason" = "completed" ] || [ "$chars" -gt 0 ]; then
              resolved="$model"

              if [ "$reason" != "completed" ]; then
                echo "::warning::$headline, but it produced $chars characters" \
                     "of output. Passing them to the verdict extractor, which" \
                     "will report whether a complete review survived."
              fi

              break
            fi

            # No text at all. Now the reason is the whole story.
            echo "::error::$headline"
            echo "$guidance"

            {
              echo "### Review failed: $reason"
              echo ""
              echo "$headline"
              echo ""
              echo "$guidance"
              echo ""
              echo "<details><summary>Session evidence</summary>"
              echo ""
              echo '```json'
              jq '{reason, exit_status, assistant_text_chars, event_counts,
                   unfinished_turn, unparsable_jsonl_lines, budget_signals,
                   rate_limit_signals, error_events}' copilot-outcome.json
              echo '```'
              echo ""
              echo '```'
              jq -r '.stderr_excerpt' copilot-outcome.json
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            cp copilot-outcome.json reviewer-failure.json

            exit 1
          done

          if [ -z "$resolved" ]; then
            echo '{"reason":"model_unavailable",' \
                 '"headline":"No candidate model was available",' \
                 '"guidance":"Availability is resolved per identity."}' \
              > reviewer-failure.json

            echo "::error::None of these models were available to the Actions" \
                 "GITHUB_TOKEN identity: $REVIEWER_MODELS. Check the Copilot" \
                 "model policy at https://github.com/settings/copilot/features," \
                 "then set the REVIEWER_MODELS repository variable. (last" \
                 "reason: $last_reason)"
            exit 1
          fi

          echo "REVIEWER_MODEL_USED=$resolved" >> "$GITHUB_ENV"

      # The reviewer's contract puts VERDICT on the first line, which makes a
      # truncated review the dangerous case rather than the obvious one: the
      # verdict survives and the reasoning behind it does not. A review cut
      # off halfway through its acceptance-criteria table still says
      # "VERDICT: PASS" at the top, and the steps after this one would comment
      # it on the pull request and apply review:pass to it.
      #
      # So a session that did not finish does not get to publish a verdict,
      # however well-formed its first line looks.
      - name: Extract Verdict
        id: verdict
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import sys

          EVIDENCE_CHARS = 1500

          # The four headings the prompt asks for. Their absence in a session
          # that ended cleanly is a formatting miss worth a warning; their
          # absence in a session that was cut short is how you tell how far
          # the reviewer actually got.
          REQUIRED_SECTIONS = [
              "## Acceptance Criteria",
              "## Scope Adherence",
              "## Findings",
              "## Required Before Merge",
          ]

          jsonl = pathlib.Path("copilot-output.jsonl")

          outcome_path = pathlib.Path("copilot-outcome.json")

          outcome = (
              json.loads(outcome_path.read_text())
              if outcome_path.exists()
              else {}
          )


          def fail(kind, headline, guidance, evidence=""):
              """Record a classified failure and stop the job."""

              pathlib.Path("reviewer-failure.json").write_text(
                  json.dumps(
                      {
                          "reason": kind,
                          "headline": headline,
                          "guidance": guidance,
                          "evidence": evidence[:EVIDENCE_CHARS],
                          "session_reason": outcome.get("reason"),
                          "assistant_text_chars": outcome.get(
                              "assistant_text_chars"
                          ),
                          "unfinished_turn": outcome.get("unfinished_turn"),
                          "credit_limit": outcome.get("credit_limit"),
                      },
                      indent=2,
                  )
                  + "\n"
              )

              print(f"::error::{headline}")
              print(guidance)

              if evidence:
                  print("--- reviewer output ---")
                  print(evidence[:EVIDENCE_CHARS])

              sys.exit(1)


          if not jsonl.exists():
              fail(
                  "no_output",
                  "Copilot produced no output file",
                  "The CLI did not write copilot-output.jsonl at all. This is"
                  " a harness fault rather than a model or budget failure.",
              )

          parts = []

          for raw_line in jsonl.read_text(errors="replace").splitlines():
              raw_line = raw_line.strip()

              if not raw_line:
                  continue

              try:
                  event = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue

              if event.get("type") != "assistant.message":
                  continue

              content = (event.get("data") or {}).get("content")

              if isinstance(content, str):
                  parts.append(content)
              elif isinstance(content, list):
                  for block in content:
                      if isinstance(block, dict) and block.get("type") == "text":
                          parts.append(block.get("text", ""))

          # Two separate questions, because the cap is soft and they can
          # disagree. `cut_off` means the session demonstrably stopped
          # mid-sentence. `budget_hit` means it reached its cap -- which on
          # its own proves nothing, since an in-flight response is allowed to
          # finish. Only the combination of a cap and an incomplete review
          # makes the output unpublishable.
          cut_off = bool(
              outcome.get("unfinished_turn")
              or outcome.get("reason") == "session_error"
          )

          budget_hit = outcome.get("reason") == "budget_exhausted"

          if not parts:
              if cut_off or budget_hit:
                  fail(
                      "budget_exhausted",
                      outcome.get(
                          "headline",
                          "Copilot stopped before writing any review",
                      ),
                      outcome.get("guidance", ""),
                  )

              fail(
                  "no_assistant_output",
                  "Copilot returned no assistant message",
                  "The session ended without the reviewer saying anything."
                  " Check the event counts in the job log.",
              )

          text = "\n".join(parts).strip()

          if text.startswith("```"):
              lines = text.splitlines()[1:]

              if lines and lines[-1].strip() == "```":
                  lines = lines[:-1]

              text = "\n".join(lines).strip()

          missing = [
              heading
              for heading in REQUIRED_SECTIONS
              if heading not in text
          ]

          match = re.search(
              r"^\s*VERDICT:\s*"
              r"(PASS|FIX|PLANNING FAILURE|DESIGN AMBIGUITY)\s*$",
              text,
              re.MULTILINE,
          )

          if not match:
              if cut_off or budget_hit:
                  fail(
                      "budget_exhausted",
                      "Copilot stopped mid-review, most likely on its AI"
                      f" credit limit ({outcome.get('credit_limit', '?')}"
                      " credits)",
                      "The reviewer was cut off before it emitted a VERDICT"
                      " line. Nothing here is a formatting problem -- there"
                      " was simply not enough budget to finish. Raise the"
                      " credit cap for this workflow, or narrow the diff,"
                      " then retry. Do not change the prompt.",
                      text,
                  )

              fail(
                  "malformed_verdict",
                  "The reviewer emitted no recognisable VERDICT line",
                  "The session ran to completion within budget and still did"
                  " not open with a VERDICT line, so this is a"
                  " prompt-following failure rather than a truncated or"
                  " budget-stopped one. The reviewer's full output is below.",
                  text,
              )

          verdict = match.group(1)

          # A verdict without the reasoning that earned it must not reach the
          # pull request. Publishing a truncated PASS is worse than publishing
          # nothing, because the label it applies looks exactly like a real
          # one.
          #
          # A review that reached the cap but still emitted every section it
          # was asked for is complete, and gets published with a warning. The
          # sections are the completeness signal here, the way a closing brace
          # is for the planner's JSON.
          if cut_off or (budget_hit and missing):
              fail(
                  "truncated_review",
                  f"The reviewer returned VERDICT: {verdict} but the session"
                  " was cut short before the review was finished",
                  "The verdict line comes first, so it survives a truncation"
                  " that removes the analysis behind it"
                  + (
                      f" -- {len(missing)} of the {len(REQUIRED_SECTIONS)}"
                      f" required sections are missing ({', '.join(missing)})."
                      if missing
                      else "."
                  )
                  + " This verdict has NOT been published and no review label"
                  " was applied. Raise the credit cap for this workflow, or"
                  " narrow the diff, then retry.",
                  text,
              )

          # The session finished. A missing heading here is the model being
          # loose with the format, not evidence of a cut-off review, so it is
          # surfaced and the verdict still stands.
          if missing:
              print(
                  "::warning::The review is missing "
                  + ", ".join(missing)
                  + ". The session ran to completion, so the verdict stands,"
                  " but the report is not in the requested shape."
              )

          pathlib.Path("review.md").write_text(text + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"verdict={verdict}\n")
              handle.write(
                  "slug="
                  + verdict.lower().replace(" ", "-")
                  + "\n"
              )

          print(f"VERDICT: {verdict}")

          if outcome.get("budget_signals"):
              print(
                  "::warning::This review is complete, but the session"
                  " reached its AI credit limit"
                  f" ({outcome.get('credit_limit')} credits) on the way."
                  " Raise REVIEWER_MAX_AI_CREDITS before the next diff of"
                  " this size."
              )

      - name: Publish Review
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "<!-- agent-review-verdict -->"
            echo ""
            echo "## Automated Review — \`${{ steps.verdict.outputs.verdict }}\`"
            echo ""
            cat review.md
            echo ""
            echo "---"
            echo ""
            echo "Reviewed by \`.github/agents/03-reviewer.agent.md\` via" \
                 "\`agent-03-review.yml\` on \`$REVIEWER_MODEL_USED\`."
            echo "Re-run by adding the \`agent:review\` label."
          } > review-comment.md

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file review-comment.md

          cat review-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Verdict Label
        shell: bash
        run: |
          set -euo pipefail

          ensure_label () {
            if ! gh label list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 200 \
                --json name \
                --jq '.[].name' |
                grep -Fxq "$1"
            then
              gh label create "$1" \
                --repo "$GITHUB_REPOSITORY" \
                --color "$2" \
                --description "$3"
            fi
          }

          ensure_label "review:pass" "0E8A16" "Automated review returned PASS"
          ensure_label "review:fix" "D93F0B" "Automated review returned FIX"
          ensure_label "review:planning-failure" "B60205" \
            "Automated review returned PLANNING FAILURE"
          ensure_label "review:design-ambiguity" "FBCA04" \
            "Automated review returned DESIGN AMBIGUITY"

          for STALE in review:pass review:fix review:planning-failure \
                       review:design-ambiguity; do
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$STALE" || true
          done

          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "review:${{ steps.verdict.outputs.slug }}"

          # The label is consumed so re-adding it is a clean re-review signal.
          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --remove-label "agent:review" || true

      # Until now a failed review said nothing at all: the run went red, the
      # pull request looked un-reviewed, and `agent:review` stayed attached --
      # which meant re-adding the label could not retrigger anything, because
      # it was never removed. Both halves of that are fixed here.
      #
      # This posts no verdict and applies no review label. A review that did
      # not finish has no verdict to give, and the whole point of the
      # classification is that "the reviewer ran out of credits" and "the
      # reviewer ignored the format" are different messages to a human.
      - name: Report Review Failure
        if: failure()
        shell: python
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          run_url = os.environ["RUN_URL"]
          credit_env = os.environ.get("REVIEWER_MAX_AI_CREDITS", "unset")

          failure_path = pathlib.Path("reviewer-failure.json")

          failure = {}

          if failure_path.exists():
              try:
                  failure = json.loads(failure_path.read_text())
              except json.JSONDecodeError:
                  failure = {}

          reason = failure.get("reason", "unknown")

          # The CLI refuses any --max-ai-credits below 30, so 30 is the floor
          # rather than a tuning choice -- which means "raise the cap" is the
          # only lever here, and it is worth saying so explicitly.
          NEXT_STEPS = {
              "budget_exhausted": (
                  "Raise `REVIEWER_MAX_AI_CREDITS` in"
                  " `.github/workflows/agent-03-review.yml` (currently"
                  " `{credit_limit}`; 30 is the CLI's floor, not a ceiling),"
                  " or split this pull request into smaller ones. Then remove"
                  " and re-add `agent:review`. Re-running unchanged will stop"
                  " at the same place."
              ),
              "truncated_review": (
                  "Raise `REVIEWER_MAX_AI_CREDITS` in"
                  " `.github/workflows/agent-03-review.yml` (currently"
                  " `{credit_limit}`), or split this pull request, then"
                  " re-add `agent:review`. **Do not read the verdict above as"
                  " a result** -- the reviewer never finished the analysis"
                  " behind it."
              ),
              "malformed_verdict": (
                  "The reviewer had the budget to finish and still did not"
                  " open with a `VERDICT:` line. Retry once; if it repeats,"
                  " the prompt in the Build Reviewer Request step needs"
                  " tightening, not a bigger budget."
              ),
              "rate_limited": (
                  "Nothing is misconfigured. Re-add `agent:review` in a few"
                  " minutes."
              ),
              "model_unavailable": (
                  "No candidate model was available to the Actions"
                  " `GITHUB_TOKEN` identity. Check"
                  " https://github.com/settings/copilot/features, then set"
                  " the `REVIEWER_MODELS` repository variable."
              ),
              "harness_error": (
                  "This is a workflow fault, not a model or budget fault."
                  " Retrying without changing anything will fail the same"
                  " way."
              ),
              "no_assistant_output": (
                  "The session produced nothing at all. Check the run log for"
                  " the event counts before retrying."
              ),
              "no_output": (
                  "Copilot CLI wrote no output file. Check that the CLI"
                  " installed on the runner."
              ),
          }

          lines = [
              "<!-- agent-review-failed -->",
              "",
              "## Automated review did not complete",
              "",
              "**No verdict was published and no `review:*` label was"
              " applied.** This pull request has not been reviewed.",
              "",
          ]

          if failure:
              lines += [
                  f"**{failure.get('headline', 'The review run failed')}**",
                  "",
                  f"Reason: `{reason}`",
                  "",
              ]

              guidance = failure.get("guidance")

              if guidance:
                  lines += [guidance, ""]

              next_step = NEXT_STEPS.get(reason)

              if next_step:
                  lines += [
                      "### What to do",
                      "",
                      next_step.format(
                          credit_limit=failure.get("credit_limit")
                          or credit_env
                      ),
                      "",
                  ]

              evidence = failure.get("evidence")

              if evidence:
                  lines += [
                      "<details><summary>What the reviewer returned</summary>",
                      "",
                      "```",
                      evidence,
                      "```",
                      "",
                      "</details>",
                      "",
                  ]
          else:
              lines += [
                  "The run did not fail inside the Copilot session, so this"
                  " is a failure in the GitHub steps around it — resolving"
                  " the pull request and its task contract, publishing the"
                  " comment, or applying the label.",
                  "",
              ]

          lines += [
              f"Full run log: {run_url}",
              "",
              "`agent:review` has been removed, so re-adding it is a clean"
              " retry.",
          ]

          body = "\n".join(lines)

          subprocess.run(
              [
                  "gh",
                  "pr",
                  "comment",
                  pr_number,
                  "--repo",
                  repo,
                  "--body",
                  body,
              ],
              check=True,
          )

          # Removed last: if the comment call fails, the label is still there
          # and the pull request still looks like it is awaiting review, which
          # is the truthful state.
          subprocess.run(
              [
                  "gh",
                  "pr",
                  "edit",
                  pr_number,
                  "--repo",
                  repo,
                  "--remove-label",
                  "agent:review",
              ],
              check=False,
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n" + body + "\n")
