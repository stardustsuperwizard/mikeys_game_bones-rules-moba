name: Agent - PR Review

# Reviews a Copilot implementation pull request against the Implementation
# Task Issue that authorizes it, and emits a machine-readable verdict.
#
# No AWNN number, unlike Plan/Execute/Rollup: those three are the flow a
# human walks through step by step (01 -> 02 -> 03), coupled by that
# numbering on purpose. Review (like Fix) is a reactive support agent
# instead -- it runs on demand (the `agent:reviewer:copilot` label) or as part of
# Execute's own pre-PR pass, not as a sequential step in that flow.
#
# The actual work happens in three composite actions shared with
# agent-02-implement.yml's pre-PR review gate and agent-05-fix.yml:
#
#   - build-review-request  -- pulls the PR/task/diff and writes the prompt
#   - run-agent-session     -- runs the model, walking a fallback list
#   - extract-review-verdict -- turns the session's text into a VERDICT
#
# This workflow's own job is everything specific to reviewing an *existing*
# pull request: resolving which PR, publishing the comment, and applying
# the review:* label. "The workflow pulls the PR information, the review
# agent just processes the review" -- the composite actions are that split
# made literal.
#
# This runs as a Copilot CLI session rather than a cloud agent for the same
# reason the planner does: the cloud agent is built to produce a diff, and a
# reviewer must not. Tools capable of editing or executing are removed rather
# than merely discouraged.
#
# GitHub's built-in Copilot code review is complementary, not a replacement --
# it reviews code quality but does not check the diff against the Issue's
# acceptance criteria.

on:
  pull_request:
    types:
      - ready_for_review
      - labeled

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review"
        required: true
        type: number

      vendor:
        description: >
          Which company answers. A labelled run takes this from the label's
          third segment instead; this input exists because workflow_dispatch
          has no label to read.
        required: false
        type: choice
        options:
          - copilot
          - claude
        default: copilot

permissions:
  contents: read
  issues: write
  pull-requests: write
  copilot-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent - PR Review
    runs-on: ubuntu-latest

    # Automatic on a Copilot or Claude branch becoming ready; manual anywhere else via
    # the agent:reviewer:copilot label, which works from the GitHub mobile apps.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       (github.event.label.name == 'agent:reviewer:copilot' ||
        github.event.label.name == 'agent:reviewer:claude')) ||
      (github.event.action == 'ready_for_review' &&
       (startsWith(github.event.pull_request.head.ref, 'copilot/') ||
        startsWith(github.event.pull_request.head.ref, 'claude/')))

    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

      # Review is the correctness gate, so it gets the strong model. This is
      # a *preference list*, not a single id — see the long note in
      # agent-01-planner.yml for why availability is per-identity and a
      # picker-visible model can still be refused to this job.
      #
      # Every entry stays in the strong tier; a cheap reviewer is worse than
      # no reviewer. Overridable via the REVIEWER_MODELS repository variable
      # (comma-separated); the older REVIEWER_MODEL is honoured first if set.
      # One list per vendor, selected by the label's vendor segment. The ids
      # are NOT interchangeable -- Copilot spells Opus 4.8 `claude-opus-4.8`,
      # Claude Code spells it `claude-opus-4-8` -- so copying one list into
      # the other variable walks every candidate and then blames availability.
      # `REVIEWER_MODELS` / `REVIEWER_MODEL` are the pre-vendor names, read
      # as a copilot fallback for the reason given in agent-01-planner.yml.
      COPILOT_REVIEWER_MODELS: >-
        ${{ vars.COPILOT_REVIEWER_MODELS
        || vars.REVIEWER_MODELS
        || vars.REVIEWER_MODEL
        || 'claude-opus-5,claude-opus-4.8,claude-opus-4.7,claude-sonnet-5' }}

      CLAUDE_REVIEWER_MODELS: >-
        ${{ vars.CLAUDE_REVIEWER_MODELS
        || 'claude-opus-5,claude-opus-4-8,claude-sonnet-5' }}

      # The label that triggered this run, or empty. Consumed at the end, so
      # it must be readable from every step.
      TRIGGER_LABEL: ${{ github.event.label.name }}

      # Claude's bound. Review reads a lot and writes one verdict.
      REVIEWER_MAX_TURNS: "40"

      # Soft cap for this review session. The Copilot CLI rejects any
      # value below 30 before it starts work, so 30 is the floor, not a
      # tuning choice.
      REVIEWER_MAX_AI_CREDITS: "150"

      # Reviewing a very large diff costs more than it is worth; past this
      # the diff is truncated and the verdict says so.
      MAX_DIFF_CHARS: "150000"

    steps:
      # The vendor comes from the label's third segment. Everything after
      # this step reads one outcome file and one text file and never learns
      # which company answered.
      - name: Route Vendor
        id: route
        shell: bash
        env:
          LABEL: ${{ github.event.label.name }}
          DISPATCH_VENDOR: ${{ inputs.vendor }}
        run: |
          set -euo pipefail

          # A `ready_for_review` run and a workflow_dispatch have no label to
          # read; both mean copilot, which is the surface they came from.
          case "$LABEL" in
            agent:reviewer:claude)  VENDOR=claude ;;
            agent:reviewer:copilot) VENDOR=copilot ;;
            *)                    VENDOR="${DISPATCH_VENDOR:-copilot}" ;;
          esac

          case "$VENDOR" in
            copilot) MODELS="$COPILOT_REVIEWER_MODELS" ;;
            claude)  MODELS="$CLAUDE_REVIEWER_MODELS" ;;
            *)
              echo "::error::Unknown vendor '$VENDOR'."
              exit 1
              ;;
          esac

          echo "vendor=$VENDOR" >> "$GITHUB_OUTPUT"
          echo "models=$MODELS" >> "$GITHUB_OUTPUT"
          echo "Running as $VENDOR; candidates: $MODELS"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Changed GDScript Files
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json files \
            --jq '.files[].path' \
            | grep -E '\.gd$' \
            > changed-gd-files.txt || true

      # Best-effort: a lint-tooling hiccup must not block a review that
      # would otherwise work -- it just runs without the static-analysis
      # section. Diff-scoped by design; see lint-gdscript/action.yml.
      - name: Lint Changed GDScript Files
        id: lint
        continue-on-error: true
        uses: ./.github/actions/lint-gdscript
        with:
          mode: check
          files-list-file: changed-gd-files.txt

      - name: Build Review Request
        id: build
        uses: ./.github/actions/build-review-request
        with:
          mode: pr
          pr-number: ${{ env.PR_NUMBER }}
          max-diff-chars: ${{ env.MAX_DIFF_CHARS }}
          lint-report-file: >-
            ${{ steps.lint.outcome == 'success' && steps.lint.outputs.report-file || '' }}

      - name: Run Reviewer Session
        id: session
        uses: ./.github/actions/run-agent-session
        with:
          vendor: ${{ steps.route.outputs.vendor }}
          prompt-file: ${{ steps.build.outputs.prompt-file }}
          models: ${{ steps.route.outputs.models }}
          max-ai-credits: ${{ env.REVIEWER_MAX_AI_CREDITS }}
          max-turns: ${{ env.REVIEWER_MAX_TURNS }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Same capability-removal posture as the planner: the reviewer
          # can read the checkout but holds no tool that can change it.
          capability: read-only
          step-label: "Reviewing"

      - name: Extract Verdict
        id: verdict
        uses: ./.github/actions/extract-review-verdict
        with:
          assistant-text-file: ${{ steps.session.outputs.assistant-text-file }}
          outcome-file: ${{ steps.session.outputs.outcome-file }}

      - name: Publish Review
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "<!-- agent-review-verdict -->"
            echo ""
            echo "## Automated Review — \`${{ steps.verdict.outputs.verdict }}\`"
            echo ""
            cat "${{ steps.verdict.outputs.review-file }}"
            echo ""
            echo "---"
            echo ""
            echo "Reviewed by \`.github/agents/03-reviewer.agent.md\` via" \
                 "\`agent-04-review.yml\` on \`${{ steps.session.outputs.resolved-model }}\`."
            echo "Re-run by adding the \`agent:reviewer:copilot\` label."
          } > review-comment.md

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file review-comment.md

          cat review-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Verdict Label
        shell: bash
        run: |
          set -euo pipefail

          ensure_label () {
            if ! gh label list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 200 \
                --json name \
                --jq '.[].name' |
                grep -Fxq "$1"
            then
              gh label create "$1" \
                --repo "$GITHUB_REPOSITORY" \
                --color "$2" \
                --description "$3"
            fi
          }

          ensure_label "review:pass" "0E8A16" "Automated review returned PASS"
          ensure_label "review:fix" "D93F0B" "Automated review returned FIX"
          ensure_label "review:planning-failure" "B60205" \
            "Automated review returned PLANNING FAILURE"
          ensure_label "review:design-ambiguity" "FBCA04" \
            "Automated review returned DESIGN AMBIGUITY"

          for STALE in review:pass review:fix review:planning-failure \
                       review:design-ambiguity; do
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$STALE" || true
          done

          gh pr edit "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "review:${{ steps.verdict.outputs.slug }}"

          # The label is consumed so re-adding it is a clean re-review signal.
          # Release the button that was pressed. Empty on a
          # workflow_dispatch run, which pressed none.
          if [ -n "$TRIGGER_LABEL" ]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$TRIGGER_LABEL" || true
          fi

      # Until now a failed review said nothing at all: the run went red, the
      # pull request looked un-reviewed, and `agent:reviewer:copilot` stayed attached --
      # which meant re-adding the label could not retrigger anything, because
      # it was never removed. Both halves of that are fixed here.
      #
      # This posts no verdict and applies no review label. A review that did
      # not finish has no verdict to give, and the whole point of the
      # classification is that "the session ran out of credits" and "the
      # session ignored the format" are different messages to a human.
      - name: Report Review Failure
        if: failure()
        shell: python
        env:
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository
            }}/actions/runs/${{ github.run_id }}
        run: |
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          run_url = os.environ["RUN_URL"]
          credit_env = os.environ.get("REVIEWER_MAX_AI_CREDITS", "unset")

          # Whichever of the two composite actions failed left its own
          # failure file behind; the other one was never reached.
          failure = {}

          for candidate in ("review-verdict-failure.json", "agent-session-failure.json"):
              path = pathlib.Path(candidate)

              if path.exists():
                  try:
                      failure = json.loads(path.read_text())
                  except json.JSONDecodeError:
                      failure = {}
                  break

          reason = failure.get("reason", "unknown")

          # The CLI refuses any --max-ai-credits below 30, so 30 is the floor
          # rather than a tuning choice -- which means "raise the cap" is the
          # only lever here, and it is worth saying so explicitly.
          NEXT_STEPS = {
              "budget_exhausted": (
                  "Raise `REVIEWER_MAX_AI_CREDITS` in"
                  " `.github/workflows/agent-04-review.yml` (currently"
                  " `{credit_limit}`; 30 is the CLI's floor, not a ceiling),"
                  " or split this pull request into smaller ones. Then remove"
                  " and re-add the same label. Re-running unchanged will stop"
                  " at the same place."
              ),
              "truncated_review": (
                  "Raise `REVIEWER_MAX_AI_CREDITS` in"
                  " `.github/workflows/agent-04-review.yml` (currently"
                  " `{credit_limit}`), or split this pull request, then"
                  " re-add the same label. **Do not read the verdict above as"
                  " a result** -- the reviewer never finished the analysis"
                  " behind it."
              ),
              "malformed_verdict": (
                  "The reviewer had the budget to finish and still did not"
                  " open with a `VERDICT:` line. Retry once; if it repeats,"
                  " the prompt in `build-review-request/action.yml` needs"
                  " tightening, not a bigger budget."
              ),
              "rate_limited": (
                  "Nothing is misconfigured. Re-add the same label in a few"
                  " minutes."
              ),
              "model_unavailable": (
                  "No candidate model was available to the Actions"
                  " `GITHUB_TOKEN` identity. Check"
                  " https://github.com/settings/copilot/features, then set"
                  " the `COPILOT_REVIEWER_MODELS` or `CLAUDE_REVIEWER_MODELS`"
                  " repository variable, whichever vendor this run used."
              ),
              "harness_error": (
                  "This is a workflow fault, not a model or budget fault."
                  " Retrying without changing anything will fail the same"
                  " way."
              ),
              "no_assistant_output": (
                  "The session produced nothing at all. Check the run log for"
                  " the event counts before retrying."
              ),
          }

          lines = [
              "<!-- agent-review-failed -->",
              "",
              "## Automated review did not complete",
              "",
              "**No verdict was published and no `review:*` label was"
              " applied.** This pull request has not been reviewed.",
              "",
          ]

          if failure:
              lines += [
                  f"**{failure.get('headline', 'The review run failed')}**",
                  "",
                  f"Reason: `{reason}`",
                  "",
              ]

              guidance = failure.get("guidance")

              if guidance:
                  lines += [guidance, ""]

              next_step = NEXT_STEPS.get(reason)

              if next_step:
                  lines += [
                      "### What to do",
                      "",
                      next_step.format(
                          credit_limit=failure.get("credit_limit")
                          or credit_env
                      ),
                      "",
                  ]

              evidence = failure.get("evidence")

              if evidence:
                  lines += [
                      "<details><summary>What the reviewer returned</summary>",
                      "",
                      "```",
                      evidence,
                      "```",
                      "",
                      "</details>",
                      "",
                  ]
          else:
              lines += [
                  "The run did not fail inside the Copilot session, so this"
                  " is a failure in the GitHub steps around it — resolving"
                  " the pull request and its task contract, publishing the"
                  " comment, or applying the label.",
                  "",
              ]

          lines += [
              f"Full run log: {run_url}",
              "",
              "Any trigger label has been released, so re-adding it is a clean"
              " retry.",
          ]

          body = "\n".join(lines)

          subprocess.run(
              [
                  "gh",
                  "pr",
                  "comment",
                  pr_number,
                  "--repo",
                  repo,
                  "--body",
                  body,
              ],
              check=True,
          )

          # Removed last: if the comment call fails, the label is still there
          # and the pull request still looks like it is awaiting review, which
          # is the truthful state.
          #
          # The label that was pressed, not a hardcoded one -- otherwise an
          # `agent:reviewer:claude` run leaves the claude label attached and
          # re-adding it cannot retrigger, which is exactly what the message
          # above promises it can. Empty on a dispatch or ready_for_review run,
          # which pressed no button.
          trigger_label = os.environ.get("TRIGGER_LABEL") or ""

          if trigger_label:
              subprocess.run(
                  [
                      "gh",
                      "pr",
                      "edit",
                      pr_number,
                      "--repo",
                      repo,
                      "--remove-label",
                      trigger_label,
                  ],
                  check=False,
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n" + body + "\n")
