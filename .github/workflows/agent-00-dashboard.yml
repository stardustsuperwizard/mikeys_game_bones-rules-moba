name: Agent - Control Plane

# Regenerates the derived control plane into a pinned Issue.
#
# Most repository state is now read through GitHub issue *views* -- saved
# label queries, evaluated when you look at them, nothing to run and nothing
# to keep fresh. See docs/AGENT_WORKFLOW.md. What a view cannot express is
# the **dependency graph**: `blocker` says an Issue blocks something but not
# what, so "ready to dispatch, in dependency order" still has to be computed.
# That is the one job left here, and it is why this workflow still exists.
#
# It reads the graph, it does not build it. `issue-dependencies.yml` creates
# the blocked-by relationships from each Issue's `## Dependencies` table; a
# task missing from the blocked list here means that table is wrong or was
# never wired, not that this renderer lost it.
#
# Every state it shows is computed fresh from issues, GitHub issue
# dependencies, sub-issue links, open pull requests and the reviewer's
# `review:*` labels. Nothing is stored, so nothing can drift -- a failed run
# leaves this Issue stale, never leaves the repository wrong.
#
# Spends no AI credits and needs no secrets beyond GITHUB_TOKEN.

on:
  # The refresh button. Add `dashboard:update` to any Issue -- the pinned
  # control plane Issue itself is the obvious place -- and this runs. The
  # last step of every run clears the label again, so it is a button rather
  # than a state: re-adding it is another refresh.
  #
  # This subscribes to `labeled` on every Issue, but the job below runs only
  # for this one label name. Every other label event terminates in the
  # skipped-job check, costing nothing.
  issues:
    types:
      - labeled

  workflow_dispatch:

  # Commented out, not deleted, while the right cadence is being worked out.
  #
  # This is the expensive trigger: it fires on every PR event including
  # `opened`, so it stacks a render onto the moment a PR is created --
  # alongside `agent-04-review.yml` and `godot-ci-validation.yml`, which is
  # exactly the pile-up worth avoiding. Re-enable it only if the control
  # plane going stale between manual refreshes turns out to cost more than
  # the noise.
  #
  # `pull_request`, not `pull_request_target`: every PR here comes from a
  # `copilot/*` branch in this repository, so the token is writable and the
  # fork-token hazard of _target buys nothing.
  #
  # pull_request:
  #   types:
  #     - opened
  #     - closed
  #     - reopened
  #     - ready_for_review
  #     - converted_to_draft
  #     - labeled
  #     - unlabeled

  # Also commented out. This was the staleness bound: a nightly run meant a
  # missed refresh could not leave the board wrong for longer than a day.
  # Without it, staleness is bounded by you remembering to add the label --
  # which is the trade being tested.
  #
  # schedule:
  #   - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Only the most recent render matters — an in-flight one is reading state
  # that a newer event has already superseded.
  group: agent-dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    name: Agent - Control Plane
    runs-on: ubuntu-latest

    # `issues.labeled` fires for every label on every Issue; only one label
    # name means "render". Written as a not-issues escape hatch rather than a
    # list of allowed events so that uncommenting `pull_request` or
    # `schedule` above needs no second edit here.
    #
    # This also breaks the one loop available to it: creating and labelling
    # the dashboard Issue fires `labeled` with the name `dashboard`, which
    # does not match, so a render can never cause a render.
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'dashboard:update'

    env:
      GH_TOKEN: ${{ github.token }}

      # The Issue carrying the dashboard is found by this label, not by title
      # or by searching for the body marker, so renaming it is harmless.
      DASHBOARD_LABEL: dashboard
      DASHBOARD_TITLE: Agent Control Plane

      # The trigger label, consumed by the last step of every run. Distinct
      # from DASHBOARD_LABEL: that one marks *which Issue is the board*, this
      # one is a request to redraw it.
      REFRESH_LABEL: dashboard:update

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find or Create the Dashboard Issue
        id: issue
        shell: bash
        run: |
          set -euo pipefail

          EXISTING=$(gh label list --repo "$GITHUB_REPOSITORY" \
            --limit 200 --json name --jq '.[].name')

          if ! grep -qx "$DASHBOARD_LABEL" <<<"$EXISTING"; then
            gh label create "$DASHBOARD_LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --color "5319E7" \
              --description "Generated agent control plane" \
              --force
          fi

          # A label that does not exist cannot be added, so the refresh
          # button would have no way to appear. Creating it here means the
          # first manual dispatch is enough to set it up.
          if ! grep -qx "$REFRESH_LABEL" <<<"$EXISTING"; then
            gh label create "$REFRESH_LABEL" \
              --repo "$GITHUB_REPOSITORY" \
              --color "5319E7" \
              --description "Add to re-render the control plane; consumed on run" \
              --force
          fi

          NUMBER=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$DASHBOARD_LABEL" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$NUMBER" ]; then
            echo "No dashboard Issue yet; creating one."
            URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$DASHBOARD_TITLE" \
              --label "$DASHBOARD_LABEL" \
              --body "<!-- agent-control-plane --> Generating…")
            NUMBER="${URL##*/}"

            # A repository allows three pinned Issues. If all three are
            # taken this fails, and an unpinned dashboard is still a working
            # dashboard, so it is not worth failing the run over.
            gh issue pin "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::Could not pin #$NUMBER. Pin it by hand."
          fi

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Dashboard is #$NUMBER"

      - name: Render
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/render-dashboard.py > dashboard.md
          wc -c dashboard.md

      - name: Publish
        shell: bash
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail

          # Editing a body sends no notifications, so this can run as often
          # as it likes without becoming noise.
          gh issue edit "$NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file dashboard.md

          echo "Published to #$NUMBER"

      # A render is a render no matter what started it, so the request is
      # cleared the same way every time: sweep every Issue carrying the
      # label, rather than only the one whose `labeled` event fired. A
      # dispatch or a re-enabled cron run therefore also resets the button,
      # and a request that arrives while a render is already in flight is
      # not left behind on some other Issue.
      #
      # `always()`, so a failed render still clears it. The board is stale
      # either way, and a stale board with the button already pressed is a
      # dead end -- you could not ask again without removing the label by
      # hand first. Nothing subscribes to `unlabeled`, so this cannot
      # re-trigger the workflow.
      - name: Consume the Refresh Label
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          NUMBERS=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label "$REFRESH_LABEL" \
            --limit 100 \
            --json number \
            --jq '.[].number')

          if [ -z "$NUMBERS" ]; then
            echo "No $REFRESH_LABEL to consume."
            exit 0
          fi

          for NUMBER in $NUMBERS; do
            gh issue edit "$NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$REFRESH_LABEL" \
              && echo "Consumed $REFRESH_LABEL from #$NUMBER" \
              || echo "::warning::Could not remove $REFRESH_LABEL from #$NUMBER"
          done

      - name: Summary
        if: always()
        shell: bash
        env:
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          {
            echo "## Agent Control Plane"
            echo
            echo "Rendered to issue #${NUMBER:-?}."
            echo
            if [ -f dashboard.md ]; then
              cat dashboard.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
