name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1-stable

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission.
      # If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot engine
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL \
            -o "$RUNNER_TEMP/godot/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"

          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path

          version = os.environ["GODOT_VERSION"]
          install_dir = Path(os.environ["RUNNER_TEMP"]) / "godot"
          archive = install_dir / "godot.zip"
          executable = install_dir / f"Godot_v{version}_linux.x86_64"
          target = install_dir / "godot"

          with zipfile.ZipFile(archive) as archive_file:
              archive_file.extractall(install_dir)

          executable.chmod(executable.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          executable.rename(target)
          PY

          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Validate Godot project loads headlessly
        run: |
          set -euo pipefail

          godot --version

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --quit \
            --log-file "$RUNNER_TEMP/godot-headless.log" || {
              status=$?
              echo "Godot headless validation failed."
              cat "$RUNNER_TEMP/godot-headless.log"
              exit "$status"
            }
