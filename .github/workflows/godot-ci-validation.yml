name: Godot CI Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  godot-headless-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          godot-version: 4.7.1-stable

      - name: Validate Godot project loads headlessly
        shell: bash
        run: .github/scripts/validate-godot.sh "$GITHUB_WORKSPACE"
