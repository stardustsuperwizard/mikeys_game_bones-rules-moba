name: Godot CI Validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  godot-headless-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          godot-version: 4.7.1-stable

      - name: Validate Godot project loads headlessly
        shell: bash
        run: |
          set -euo pipefail

          godot --version

          godot \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --quit \
            --log-file "$RUNNER_TEMP/godot-headless.log" || {
              status=$?
              echo "Godot headless validation failed."
              cat "$RUNNER_TEMP/godot-headless.log"
              exit "$status"
            }
