name: Set Project Status
description: >
  Add an Issue or Pull Request to the workflow Project and set its Status
  (and optionally Work Type) field. Projects v2 is not writable with the
  default GITHUB_TOKEN, so this requires a PAT with Projects read/write.

inputs:
  token:
    description: PAT with Projects read/write. Repository secret PROJECT_TOKEN.
    required: true

  owner:
    description: Login that owns the Project.
    required: true

  project-number:
    description: Project number.
    required: true

  url:
    description: Issue or Pull Request URL of the item to update.
    required: true

  status:
    description: >
      Status option name. One of Backlog, Planning, Ready, In Progress,
      In review, Blocked, Done.
    required: true

  work-type:
    description: Optional Work Type option name, either Planning or Implementation.
    required: false
    default: ""

runs:
  using: composite

  steps:
    - name: Set Project Status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        ITEM_URL: ${{ inputs.url }}
        STATUS: ${{ inputs.status }}
        WORK_TYPE: ${{ inputs.work-type }}
      run: |
        set -euo pipefail

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::PROJECT_TOKEN is empty. Add a PAT with Projects" \
               "read/write as the repository secret PROJECT_TOKEN."
          exit 1
        fi

        # item-add is idempotent in effect: adding an item already on the
        # board returns the existing item rather than duplicating it.
        gh project item-add "$PROJECT_NUMBER" \
          --owner "$OWNER" \
          --url "$ITEM_URL"

        # Projects v2 allows only one field per invocation on non-draft items.
        gh project item-edit "$PROJECT_NUMBER" \
          --owner "$OWNER" \
          --url "$ITEM_URL" \
          --field "Status" \
          --value "$STATUS"

        echo "Status -> $STATUS for $ITEM_URL"

        if [ -n "$WORK_TYPE" ]; then
          gh project item-edit "$PROJECT_NUMBER" \
            --owner "$OWNER" \
            --url "$ITEM_URL" \
            --field "Work Type" \
            --value "$WORK_TYPE"

          echo "Work Type -> $WORK_TYPE for $ITEM_URL"
        fi
