name: Run Agent Session
description: >-
  Runs one agent session against a prepared prompt and returns the model's
  answer as text. The vendor -- Copilot CLI or Claude Code -- is an input, so
  every caller gets the same contract regardless of which company's model
  answers: the same preference-list walk, the same outcome vocabulary, the
  same output files.

  This is the one place a vendor difference is allowed to exist. Above it the
  agent workflows are vendor-blind: they build a prompt, run a session, parse
  a verdict, publish it. Below it the two CLIs disagree about flags, output
  shape and failure phrasing, and that disagreement is confined here.

inputs:
  vendor:
    description: >-
      Which CLI answers: `copilot` or `claude`. Comes from the second segment
      of an `agent:{role}:{vendor}` label, so the label is what chooses the
      company.
    required: true

  prompt-file:
    description: >-
      Path to the prepared prompt, relative to the workspace. Copilot reads
      it from stdin; Claude is pointed at it by path and reads it with its
      own Read tool. Neither form passes it as an argv element -- Linux caps
      a single argument at 128 KiB (MAX_ARG_STRLEN) and a diff-bearing prompt
      exceeds that long before the larger ARG_MAX applies.
    required: true

  models:
    description: >-
      Comma-separated model id preference list, tried in order. The next
      candidate is only tried when a model is unavailable to the calling
      identity -- never after a real failure. A cheap fallback after a real
      failure would silently defeat whatever tier the caller chose.

      The ids are vendor-native and must not be copied between vendors:
      Copilot CLI spells its Opus 4.8 `claude-opus-4.8`, Claude Code spells
      the same model `claude-opus-4-8`.
    required: true

  max-ai-credits:
    description: >-
      Copilot only. Soft credit cap for the session. The CLI rejects any
      value below 30, so that is a floor, not a tuning choice. Ignored when
      vendor is `claude`.
    required: false
    default: "75"

  max-turns:
    description: >-
      Claude only. Turn ceiling for the session. Ignored when vendor is
      `copilot`. A session that hits it is classified `budget_exhausted`,
      not `completed`, so a truncated answer is never mistaken for a finished
      one.

      This and `max-ai-credits` are NOT the same knob in different units, and
      no conversion between them exists. Credits price what a session spent;
      turns count how many times it acted. A role whose credit cap was tuned
      by watching it work is not tuned at all on the other vendor, so
      changing a label's vendor segment silently reprices the role. Set both
      per role, from observation, rather than assuming one implies the other.
    required: false
    default: "60"

  capability:
    description: >-
      What this session is allowed to do: `read-only` or `write`.

      This is deliberately ONE semantic knob rather than a pass-through of
      each CLI's tool flags, because the two vendors' postures are opposites
      and a pass-through fails silently. Copilot is subtractive -- it starts
      able and `--excluded-tools` takes capability away. Claude is additive --
      under `--permission-mode dontAsk` it starts unable and `--allowedTools`
      grants capability. A caller that said "remove nothing but task" meant
      "you may edit"; the same words handed to the additive vendor mean "you
      may do nothing at all". A role would then run, write no code, and be
      indistinguishable from a model that underperformed.

      So the caller states the intent and this action encodes it per vendor.
      Adding a third posture means editing the two case statements below, in
      one file, where they can be read side by side.

      `read-only` is the default because it is the fail-safe one: a caller
      that forgets gets a session that cannot change the checkout, rather
      than one that can.
    required: false
    default: "read-only"

  api-key:
    description: >-
      Claude only. An Anthropic API key, which the caller must pass from
      `secrets.ANTHROPIC_API_KEY` -- a composite action cannot read `secrets`
      itself, so a key that is set on the repository but not threaded through
      a caller never reaches this process.

      `--bare` never reads OAuth credentials or the keychain, so this is the
      only auth that works on the claude branch. CLAUDE_CODE_OAUTH_TOKEN does
      not, whatever it is set to.

      Empty is allowed, and fails at the point of use rather than here: a
      caller running `vendor: copilot` has no reason to hold a Claude key,
      and refusing to start would make the copilot path depend on a secret it
      never uses.
    required: false
    default: ""

  step-label:
    description: >-
      Human-readable label for the run's log group and failure summary,
      e.g. "Reviewing" or "Fixing"
    required: false
    default: "Running"

outputs:
  resolved-model:
    description: The model id that actually produced output
    value: ${{ steps.run.outputs.resolved_model }}
  resolved-vendor:
    description: >-
      The vendor that produced output. Echoed back so a caller rendering a
      report does not have to thread its own input through to the summary.
    value: ${{ steps.run.outputs.resolved_vendor }}
  assistant-text-file:
    description: >-
      Path to a file holding the joined text of the session's assistant
      messages. Written even on a failed run if any text survived.
    value: agent-assistant-text.txt
  final-text-file:
    description: >-
      Path to a file holding only the session's *last* assistant message --
      its Completion Report, for the roles that end with one. Prefer this
      over assistant-text-file anywhere the text is rendered to a human as
      the session's report: a session that narrates while it works ("Now
      the doc.") puts every one of those lines into the joined file, and
      they end up in the pull request body verbatim. Falls back to the
      joined text when no single final message could be isolated, so it is
      never empty where assistant-text-file would not be.

      Claude returns one `.result` string rather than a stream of messages,
      so for that vendor this file and the joined one are identical. The two
      outputs stay distinct anyway: which one a caller wants is a property of
      the caller, not of whoever happens to be answering today.
    value: agent-final-text.txt
  outcome-file:
    description: >-
      Path to the classifier verdict for the attempt that produced output (or
      the last attempt tried, on total failure). Both vendors write the same
      schema -- see the docstring in classify-claude-outcome.py for why that
      matters.
    value: agent-outcome.json
  failure-file:
    description: >-
      Path to a failure summary, written only when no model produced usable
      output. Callers should check for its existence before reading it.
    value: agent-session-failure.json

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Agent CLI
      shell: bash
      env:
        VENDOR: ${{ inputs.vendor }}
      run: |
        set -euo pipefail

        case "$VENDOR" in
          copilot) npm install -g @github/copilot ;;
          claude)  npm install -g @anthropic-ai/claude-code ;;
          *)
            echo "::error::Unknown vendor '$VENDOR'. Expected 'copilot' or 'claude'."
            exit 1
            ;;
        esac

    # Copilot CLI model ids are not published as a stable list; they are
    # shown in the --model help text. Dumping them costs nothing and means
    # a rejected id is self-diagnosing instead of a mystery failure.
    - name: Show Available Models
      if: inputs.vendor == 'copilot'
      continue-on-error: true
      shell: bash
      env:
        MODELS: ${{ inputs.models }}
      run: |
        set +e

        copilot --version
        copilot --help 2>&1 | sed -n '/--model/,/^[[:space:]]*$/p' \
          > model-help.txt

        echo "Candidate models for this run: $MODELS"
        cat model-help.txt

        {
          echo "<details><summary>Copilot CLI model ids</summary>"
          echo ""
          echo "Candidates tried in order: \`$MODELS\`"
          echo ""
          echo '```'
          cat model-help.txt
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Show Claude Version
      if: inputs.vendor == 'claude'
      continue-on-error: true
      shell: bash
      env:
        MODELS: ${{ inputs.models }}
      run: |
        set +e
        claude --version
        echo "Candidate models for this run: $MODELS"

    - name: ${{ inputs.step-label }}
      id: run
      shell: bash
      env:
        VENDOR: ${{ inputs.vendor }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        MODELS: ${{ inputs.models }}
        MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
        MAX_TURNS: ${{ inputs.max-turns }}
        CAPABILITY: ${{ inputs.capability }}
        STEP_LABEL: ${{ inputs.step-label }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        if [ ! -f "$PROMPT_FILE" ]; then
          echo "::error::Prompt file $PROMPT_FILE does not exist."
          exit 1
        fi

        # The one place the two postures are reconciled. Read the two cases
        # together: they must grant the same real capability, or a role
        # changes behaviour when its label's vendor segment changes, which is
        # the single thing this whole standardisation exists to prevent.
        case "$CAPABILITY" in
          read-only)
            # Copilot: strip everything that can touch the checkout or spawn
            # further agents. Claude: grant only the readers.
            EXCLUDED_TOOLS="bash,powershell,apply_patch,create,edit,task,write_agent"
            ALLOWED_TOOLS="Read,Grep,Glob"
            ;;
          write)
            # Copilot: keep edit and shell, still no sub-agents. Claude:
            # grant the writers and Bash, which the implementing roles need
            # for validate-godot.sh and for `git commit`. Neither vendor gets
            # a push here -- the workflow pushes, deliberately, so the commit
            # a session made is inspected before it leaves the runner.
            EXCLUDED_TOOLS="task,write_agent"
            ALLOWED_TOOLS="Read,Grep,Glob,Edit,Write,Bash"
            ;;
          *)
            echo "::error::Unknown capability '$CAPABILITY'. Expected 'read-only' or 'write'."
            exit 1
            ;;
        esac

        echo "capability=$CAPABILITY -> copilot excludes [$EXCLUDED_TOOLS]," \
             "claude allows [$ALLOWED_TOOLS]"

        # One invocation function per vendor, one shared loop. The loop is
        # the load-bearing part -- "advance only on model_unavailable" is the
        # rule that keeps a real failure from being retried on a cheaper
        # model -- so it must not be written twice.
        #
        # Each function leaves behind: agent-outcome.json (the shared
        # schema), and whatever raw evidence its classifier needed.

        invoke_copilot() {
          local model="$1"
          local status=0

          # The prompt goes on stdin, NOT via -p "$(cat ...)": Linux caps a
          # single argv element (MAX_ARG_STRLEN, 128 KiB), independently of
          # the larger total ARG_MAX. A large diff-bearing prompt fails
          # execve() with E2BIG before copilot even starts. Copilot CLI
          # reads the prompt from stdin when -p is empty.
          copilot \
            -p "" \
            --model "$model" \
            --output-format json \
            --no-ask-user \
            --max-ai-credits "$MAX_AI_CREDITS" \
            --allow-all-tools \
            --excluded-tools "$EXCLUDED_TOOLS" \
            < "$PROMPT_FILE" \
            > copilot-output.jsonl 2> agent-error.txt || status=$?

          echo "copilot exited $status"
          echo "output: $(wc -c < copilot-output.jsonl) bytes of JSONL"

          python3 .github/scripts/classify-copilot-outcome.py \
            --jsonl copilot-output.jsonl \
            --stderr agent-error.txt \
            --exit-status "$status" \
            --model "$model" \
            --credit-limit "$MAX_AI_CREDITS" \
            --out agent-outcome.json
        }

        invoke_claude() {
          local model="$1"
          local status=0

          # Claude is pointed at the prompt file rather than fed it, for the
          # same MAX_ARG_STRLEN reason as above and because `-p` with piped
          # stdin combines the two in a way this harness would rather not
          # depend on. `--bare` is the documented mode for CI: it skips the
          # host's hooks, plugins, MCP servers, auto memory and CLAUDE.md, so
          # the run does not vary with whatever is configured on the machine
          # that happens to be executing it.
          #
          # `--bare` also never reads OAuth credentials or the keychain, so
          # ANTHROPIC_API_KEY is the only auth that works here.
          # CLAUDE_CODE_OAUTH_TOKEN does not, and the classifier says so by
          # name rather than reporting a generic failure.
          #
          # And it does not read `.claude/settings.json`, so the
          # `fallbackModel` chain committed there does NOT apply to this run.
          # That is the intended arrangement, not an oversight: the `models`
          # input above is the fallback here, it is per role rather than
          # per session, and it is the same mechanism the Copilot side uses.
          # Two fallback systems agreeing by accident would be worse than
          # one that obviously owns the job.
          claude \
            --bare \
            -p "Read $PROMPT_FILE and follow it exactly. It is the whole task." \
            --model "$model" \
            --output-format json \
            --max-turns "$MAX_TURNS" \
            --permission-mode dontAsk \
            --allowedTools "$ALLOWED_TOOLS" \
            > claude-output.json 2> agent-error.txt || status=$?

          echo "claude exited $status"
          echo "output: $(wc -c < claude-output.json) bytes of JSON"

          python3 .github/scripts/classify-claude-outcome.py \
            --json claude-output.json \
            --stderr agent-error.txt \
            --exit-status "$status" \
            --model "$model" \
            --out agent-outcome.json
        }

        # Checked before the loop, not inside it. Without a key every
        # candidate fails identically, so walking the list would turn one
        # missing secret into N identical failures and report the last one.
        if [ "$VENDOR" = "claude" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          jq -n '{reason:"harness_error",
                  headline:"No ANTHROPIC_API_KEY reached this session",
                  guidance:"A composite action cannot read `secrets` itself. The caller must pass secrets.ANTHROPIC_API_KEY to this action'"'"'s `api-key` input. `--bare` never reads OAuth credentials, so CLAUDE_CODE_OAUTH_TOKEN does not work here whatever it is set to."}' \
            > agent-session-failure.json

          echo "::error::vendor is 'claude' but no ANTHROPIC_API_KEY reached" \
               "this step. Pass secrets.ANTHROPIC_API_KEY to the api-key input."
          exit 1
        fi

        resolved=""
        last_reason=""

        IFS=',' read -r -a candidates <<< "$MODELS"

        for candidate in "${candidates[@]}"; do
          model="$(echo "$candidate" | tr -d '[:space:]')"
          [ -n "$model" ] || continue

          echo "::group::$STEP_LABEL with $model ($VENDOR)"

          case "$VENDOR" in
            copilot) invoke_copilot "$model" ;;
            claude)  invoke_claude  "$model" ;;
          esac

          reason="$(jq -r '.reason' agent-outcome.json)"
          headline="$(jq -r '.headline' agent-outcome.json)"
          guidance="$(jq -r '.guidance' agent-outcome.json)"

          echo "::endgroup::"

          last_reason="$reason"

          if [ "$reason" = "model_unavailable" ]; then
            echo "::warning::$headline. Trying the next candidate."
            continue
          fi

          chars="$(jq -r '.assistant_text_chars' agent-outcome.json)"

          # Anything that produced text goes forward, even a session that
          # ended badly -- a run can trip its credit or turn cap and still
          # return a whole answer. Whether what came back is *complete* is
          # the caller's question (e.g. extract-review-verdict), asked once,
          # in one place, using this outcome file.
          if [ "$reason" = "completed" ] || [ "$chars" -gt 0 ]; then
            resolved="$model"

            if [ "$reason" != "completed" ]; then
              echo "::warning::$headline, but it produced $chars characters" \
                   "of output."
            fi

            break
          fi

          echo "::error::$headline"
          echo "$guidance"

          {
            echo "### $STEP_LABEL failed: $reason"
            echo ""
            echo "$headline"
            echo ""
            echo "$guidance"
          } >> "$GITHUB_STEP_SUMMARY"

          cp agent-outcome.json agent-session-failure.json

          exit 1
        done

        if [ -z "$resolved" ]; then
          if [ "$VENDOR" = "claude" ]; then
            GUIDANCE="Availability is resolved per account. Check the id spelling -- Claude Code ids use dashes (claude-opus-4-8), not the dotted Copilot form -- then set the relevant CLAUDE_*_MODELS repository variable."
          else
            GUIDANCE="Availability is resolved per identity. Check https://github.com/settings/copilot/features, then set the relevant COPILOT_*_MODELS repository variable."
          fi

          jq -n \
            --arg guidance "$GUIDANCE" \
            '{reason:"model_unavailable",
              headline:"No candidate model was available",
              guidance:$guidance}' \
            > agent-session-failure.json

          echo "::error::None of these models were available to the calling" \
               "identity: $MODELS. (last reason: $last_reason)"
          exit 1
        fi

        echo "resolved_model=$resolved" >> "$GITHUB_OUTPUT"
        echo "resolved_vendor=$VENDOR" >> "$GITHUB_OUTPUT"

    # What the session cost, on the run's own summary page.
    #
    # The outcome file already carried this and nothing rendered it, so the
    # only way to answer "what is the reviewer costing us" was to reconstruct
    # it from the Console afterwards. A workflow that spends money should say
    # what it spent, next to the run that spent it.
    #
    # The two vendors report different things and this does not pretend
    # otherwise: `claude -p --output-format json` returns `total_cost_usd`,
    # an actual figure for that session, while Copilot CLI reports no spend at
    # all -- only the credit cap it was given. Showing the cap as though it
    # were a cost would be worse than showing nothing.
    - name: Report Session Cost
      if: always()
      shell: python
      env:
        STEP_LABEL: ${{ inputs.step-label }}
      run: |
        import json
        import os
        import pathlib

        outcome_path = pathlib.Path("agent-outcome.json")

        if not outcome_path.exists():
            raise SystemExit(0)

        try:
            outcome = json.loads(outcome_path.read_text())
        except json.JSONDecodeError:
            raise SystemExit(0)

        if not isinstance(outcome, dict):
            raise SystemExit(0)

        vendor = outcome.get("vendor") or "unknown"
        model = outcome.get("model") or "unknown"
        reason = outcome.get("reason") or "unknown"
        chars = outcome.get("assistant_text_chars")
        label = os.environ.get("STEP_LABEL") or "Session"

        cost = outcome.get("total_cost_usd")

        if isinstance(cost, (int, float)):
            spend = f"${cost:.4f}"
        elif vendor == "copilot":
            cap = outcome.get("credit_limit")
            # A cap, not a spend. Said so explicitly rather than printed bare.
            spend = f"no spend reported (cap {cap})" if cap else "no spend reported"
        else:
            spend = "no spend reported"

        line = (
            f"- **{label}** · `{vendor}` · `{model}` · {reason} · {spend}"
            + (f" · {chars} chars" if isinstance(chars, int) else "")
        )

        print(line)

        summary = os.environ.get("GITHUB_STEP_SUMMARY")

        if summary:
            with open(summary, "a") as handle:
                handle.write(line + "\n")

    # Runs even when the step above failed, so a truncated or budget-capped
    # session's partial text is still available to whatever the caller's
    # own failure-reporting does with it.
    - name: Extract Assistant Text
      if: always()
      shell: python
      env:
        VENDOR: ${{ inputs.vendor }}
      run: |
        import json
        import os
        import pathlib

        vendor = os.environ["VENDOR"]
        parts = []

        if vendor == "copilot":
            jsonl = pathlib.Path("copilot-output.jsonl")

            if jsonl.exists():
                for raw_line in jsonl.read_text(errors="replace").splitlines():
                    raw_line = raw_line.strip()

                    if not raw_line:
                        continue

                    try:
                        event = json.loads(raw_line)
                    except json.JSONDecodeError:
                        continue

                    if event.get("type") != "assistant.message":
                        continue

                    content = (event.get("data") or {}).get("content")

                    if isinstance(content, str):
                        parts.append(content)
                    elif isinstance(content, list):
                        for block in content:
                            if isinstance(block, dict) and block.get("type") == "text":
                                parts.append(block.get("text", ""))

        elif vendor == "claude":
            # One envelope, one answer. `.result` carries the final text --
            # and on an in-run failure Claude Code puts the failure message
            # there too, which is why it is still worth writing out on a
            # failed run rather than only on a clean one.
            envelope = pathlib.Path("claude-output.json")

            if envelope.exists():
                raw = envelope.read_text(errors="replace").strip()

                if raw:
                    try:
                        loaded = json.loads(raw)
                    except json.JSONDecodeError:
                        loaded = None

                    if isinstance(loaded, dict):
                        result = loaded.get("result")

                        if isinstance(result, str) and result.strip():
                            parts.append(result)

        text = "\n".join(parts).strip()
        pathlib.Path("agent-assistant-text.txt").write_text(text + "\n")

        # The last assistant message is the Completion Report for the roles
        # that end with one. Everything before it is the session thinking out
        # loud, which is useful in a log and noise in a pull request body.
        #
        # Falls back to the joined text rather than emitting nothing: a
        # capped session can be cut off mid-stream, and partial text is still
        # better than a blank report -- the same reasoning as the
        # `if: always()` on this step.
        final = ""

        for part in reversed(parts):
            if part.strip():
                final = part.strip()
                break

        pathlib.Path("agent-final-text.txt").write_text((final or text) + "\n")
