name: Run Copilot CLI Session
description: >-
  Runs a Copilot CLI session against a prepared prompt, walking a
  comma-separated model preference list and stopping at the first model
  available to the calling identity. Classifies how the session ended and
  extracts the assistant's final message text. Shared by every agent
  workflow so the model-fallback and outcome-classification logic --
  originally duplicated near-identically across the planner, reviewer,
  fixer, and executor -- lives in exactly one place.

inputs:
  prompt-file:
    description: Path to a file piped into the CLI via stdin as the prompt
    required: true
  models:
    description: >-
      Comma-separated model id preference list, tried in order. The next
      candidate is only tried when a model is unavailable to the calling
      identity -- never after a real failure. A cheap fallback after a real
      failure would silently defeat whatever tier the caller chose.
    required: true
  max-ai-credits:
    description: >-
      Soft credit cap for the session. The CLI rejects any value below 30,
      so that is a floor, not a tuning choice.
    required: true
  excluded-tools:
    description: Comma-separated tools to exclude from the session
    required: false
    default: "task,write_agent"
  step-label:
    description: >-
      Human-readable label for the run's log group and failure summary,
      e.g. "Reviewing" or "Fixing"
    required: false
    default: "Running"

outputs:
  resolved-model:
    description: The model id that actually produced output
    value: ${{ steps.run.outputs.resolved_model }}
  assistant-text-file:
    description: >-
      Path to a file holding the joined text of the session's assistant
      messages. Written even on a failed run if any text survived.
    value: copilot-assistant-text.txt
  final-text-file:
    description: >-
      Path to a file holding only the session's *last* assistant message --
      its Completion Report, for the roles that end with one. Prefer this
      over assistant-text-file anywhere the text is rendered to a human as
      the session's report: a session that narrates while it works ("Now
      the doc.") puts every one of those lines into the joined file, and
      they end up in the pull request body verbatim. Falls back to the
      joined text when no single final message could be isolated, so it is
      never empty where assistant-text-file would not be.
    value: copilot-final-text.txt
  outcome-file:
    description: >-
      Path to the classify-copilot-outcome.py verdict for the attempt that
      produced output (or the last attempt tried, on total failure).
    value: copilot-outcome.json
  failure-file:
    description: >-
      Path to a failure summary, written only when no model produced usable
      output. Callers should check for its existence before reading it.
    value: copilot-session-failure.json

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install GitHub Copilot CLI
      shell: bash
      run: npm install -g @github/copilot

    # Copilot CLI model ids are not published as a stable list; they are
    # shown in the --model help text. Dumping them costs nothing and means
    # a rejected id is self-diagnosing instead of a mystery failure.
    - name: Show Available Models
      continue-on-error: true
      shell: bash
      env:
        MODELS: ${{ inputs.models }}
      run: |
        set +e

        copilot --version
        copilot --help 2>&1 | sed -n '/--model/,/^[[:space:]]*$/p' \
          > model-help.txt

        echo "Candidate models for this run: $MODELS"
        cat model-help.txt

        {
          echo "<details><summary>Copilot CLI model ids</summary>"
          echo ""
          echo "Candidates tried in order: \`$MODELS\`"
          echo ""
          echo '```'
          cat model-help.txt
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: ${{ inputs.step-label }}
      id: run
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
        MODELS: ${{ inputs.models }}
        MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
        EXCLUDED_TOOLS: ${{ inputs.excluded-tools }}
        STEP_LABEL: ${{ inputs.step-label }}
      run: |
        set -euo pipefail

        if [ ! -f "$PROMPT_FILE" ]; then
          echo "::error::Prompt file $PROMPT_FILE does not exist."
          exit 1
        fi

        resolved=""
        last_reason=""

        IFS=',' read -r -a candidates <<< "$MODELS"

        for candidate in "${candidates[@]}"; do
          model="$(echo "$candidate" | tr -d '[:space:]')"
          [ -n "$model" ] || continue

          echo "::group::$STEP_LABEL with $model"

          status=0

          # The prompt goes on stdin, NOT via -p "$(cat ...)": Linux caps a
          # single argv element (MAX_ARG_STRLEN, 128 KiB), independently of
          # the larger total ARG_MAX. A large diff-bearing prompt fails
          # execve() with E2BIG before copilot even starts. Copilot CLI
          # reads the prompt from stdin when -p is empty.
          copilot \
            -p "" \
            --model "$model" \
            --output-format json \
            --no-ask-user \
            --max-ai-credits "$MAX_AI_CREDITS" \
            --allow-all-tools \
            --excluded-tools "$EXCLUDED_TOOLS" \
            < "$PROMPT_FILE" \
            > copilot-output.jsonl 2> copilot-error.txt || status=$?

          echo "copilot exited $status"
          echo "output: $(wc -c < copilot-output.jsonl) bytes of JSONL"

          python3 .github/scripts/classify-copilot-outcome.py \
            --jsonl copilot-output.jsonl \
            --stderr copilot-error.txt \
            --exit-status "$status" \
            --model "$model" \
            --credit-limit "$MAX_AI_CREDITS" \
            --out copilot-outcome.json

          reason="$(jq -r '.reason' copilot-outcome.json)"
          headline="$(jq -r '.headline' copilot-outcome.json)"
          guidance="$(jq -r '.guidance' copilot-outcome.json)"

          echo "::endgroup::"

          last_reason="$reason"

          if [ "$reason" = "model_unavailable" ]; then
            echo "::warning::$headline. Trying the next candidate."
            continue
          fi

          chars="$(jq -r '.assistant_text_chars' copilot-outcome.json)"

          # Anything that produced text goes forward, even a session that
          # ended badly -- a run can trip its credit cap and still return a
          # whole answer. Whether what came back is *complete* is the
          # caller's question (e.g. extract-review-verdict), asked once,
          # in one place, using this outcome file.
          if [ "$reason" = "completed" ] || [ "$chars" -gt 0 ]; then
            resolved="$model"

            if [ "$reason" != "completed" ]; then
              echo "::warning::$headline, but it produced $chars characters" \
                   "of output."
            fi

            break
          fi

          echo "::error::$headline"
          echo "$guidance"

          {
            echo "### $STEP_LABEL failed: $reason"
            echo ""
            echo "$headline"
            echo ""
            echo "$guidance"
          } >> "$GITHUB_STEP_SUMMARY"

          cp copilot-outcome.json copilot-session-failure.json

          exit 1
        done

        if [ -z "$resolved" ]; then
          echo '{"reason":"model_unavailable",' \
               '"headline":"No candidate model was available",' \
               '"guidance":"Availability is resolved per identity. Check https://github.com/settings/copilot/features, then set the relevant *_MODELS repository variable."}' \
            > copilot-session-failure.json

          echo "::error::None of these models were available to the calling" \
               "identity: $MODELS. (last reason: $last_reason)"
          exit 1
        fi

        echo "resolved_model=$resolved" >> "$GITHUB_OUTPUT"

    # Runs even when the step above failed, so a truncated or budget-capped
    # session's partial text is still available to whatever the caller's
    # own failure-reporting does with it.
    - name: Extract Assistant Text
      if: always()
      shell: python
      run: |
        import json
        import pathlib

        jsonl = pathlib.Path("copilot-output.jsonl")
        parts = []

        if jsonl.exists():
            for raw_line in jsonl.read_text(errors="replace").splitlines():
                raw_line = raw_line.strip()

                if not raw_line:
                    continue

                try:
                    event = json.loads(raw_line)
                except json.JSONDecodeError:
                    continue

                if event.get("type") != "assistant.message":
                    continue

                content = (event.get("data") or {}).get("content")

                if isinstance(content, str):
                    parts.append(content)
                elif isinstance(content, list):
                    for block in content:
                        if isinstance(block, dict) and block.get("type") == "text":
                            parts.append(block.get("text", ""))

        text = "\n".join(parts).strip()
        pathlib.Path("copilot-assistant-text.txt").write_text(text + "\n")

        # The last assistant message is the Completion Report for the roles
        # that end with one. Everything before it is the session thinking out
        # loud, which is useful in a log and noise in a pull request body.
        #
        # Falls back to the joined text rather than emitting nothing: a
        # budget-capped session can be cut off mid-stream, and partial text
        # is still better than a blank report -- the same reasoning as the
        # `if: always()` on this step.
        final = ""

        for part in reversed(parts):
            if part.strip():
                final = part.strip()
                break

        pathlib.Path("copilot-final-text.txt").write_text((final or text) + "\n")
