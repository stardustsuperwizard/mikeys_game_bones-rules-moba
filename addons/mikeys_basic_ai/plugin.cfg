[plugin]

name="Mikey's Basic AI"
description="A reference/default AI Controller for Mikey's Game Bones: a simple aggro-range-and-chase decision loop (SimpleAIController) implementing Bones' Controller contract. Meant to be swapped out -- a real game's AI (behavior trees, utility AI, GOAP, perception/blackboard systems) should live in its own addon and implement the same Controller contract, the same way this one does."
author="Michael Miller"
version="0.1.0"
script="plugin.gd"
