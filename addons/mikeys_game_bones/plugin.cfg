[plugin]

name="Mikey's Game Bones"
description="A reusable, genre-agnostic gameplay framework for Godot 4: GameObject/ObjectDefinition (traits, capabilities, state), Actor (a presentation-neutral Node with 3D/2D presentation bodies), Controller (a decision-making contract -- see mikeys_basic_ai for a reference AI implementation), and Action/ActionRunner/Rules/Authority (a request -> legality-check -> resolve -> result pipeline). Deliberately carries no game-specific rules, combat resolution, AI decision logic, or UI -- those belong in the game (or a dedicated addon) that consumes this addon."
author="Michael Miller"
version="0.1.0"
script="plugin.gd"
